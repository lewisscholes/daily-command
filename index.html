<!DOCTYPE html>
<!-- YouDo build: remove calendar tab -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>YouDo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#f7f7f5; --panel:#fbfbfa; --card:#ffffff; --ink:#37352f; --muted:#9b9a97;
  --line:#ececeb; --line2:#e3e3e1; --accent:#5b6cff; --accent-soft:#eef0ff;
  --signal:#e8a13a; --signal-soft:#fdf3e3; --noise:#b6b5b1; --ok:#3aa675; --ok-soft:#e7f6ee;
  --shadow:0 1px 2px rgba(15,15,15,.04),0 4px 16px rgba(15,15,15,.05);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
/* 16px inputs prevent iOS Safari from zooming in on focus */
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
::placeholder{color:#bdbcb8}

/* ---------- Layout ---------- */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b6cff,#8a6cff);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 30px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;
  color:#5f5e5a;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;transition:.12s}
.nav button:hover{background:#f0f0ef}
.nav button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.nav button svg{width:17px;height:17px;flex:0 0 17px;opacity:.7}
.nav .label{font-size:11px;font-weight:600;color:#b6b5b1;text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 4px}
.side-foot{margin-top:auto;padding:10px 8px;font-size:12px;color:var(--muted)}
.side-foot button{background:none;border:none;color:var(--muted);font-size:12px;padding:0;text-decoration:underline}

.main{flex:1;overflow-y:auto;padding:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:13px;color:var(--muted)}
.daynav{margin-left:auto;display:flex;align-items:center;gap:6px}
.daynav button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 10px;color:var(--ink);font-weight:500}
.daynav button:hover{background:#f4f4f3}
.daynav .today-pill{font-weight:600}
.wrap{padding:24px 32px 64px;max-width:1180px;margin:0 auto}

/* ---------- Generic ---------- */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.cols-2,.cols-3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:14px;font-weight:600}
.card-h .ic{width:18px;height:18px;color:var(--accent)}
.card-h .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.card-b{padding:8px 10px 12px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 4px}

.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-weight:600;color:var(--ink);font-size:13px;transition:.12s}
.btn:hover{background:#f4f4f3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:#f0f0ef;color:var(--ink)}

.row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px}
.row:hover{background:#f7f7f6}
.row:hover .row-acts{opacity:1}
.row-acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s}
.chk{width:18px;height:18px;flex:0 0 18px;border:1.6px solid #cfcfcc;border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:.12s}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk svg{width:12px;height:12px;opacity:0}
.chk.done svg{opacity:1}
.rt{flex:1;min-width:0}
.rt .t{font-weight:500}
.rt.done .t{text-decoration:line-through;color:var(--muted)}
.rt .m{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:1px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#f0f0ef;color:#6f6e6a}
.tag.food{background:#eef7f0;color:#3a8c5e}.tag.supplement{background:#f0f0ff;color:#6a5bd6}
.tag.workout{background:#fdeee6;color:#c87a3a}.tag.relationship{background:#fdeef4;color:#c75b91}
.tag.find_creators{background:#eef0ff;color:#5b6cff}.tag.product_testing{background:#eef7f0;color:#3a8c5e}
.tag.advertisements{background:#fdf3e3;color:#c08a2a}.tag.admin{background:#f0f0ef;color:#7a7975}

.quick{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);margin-top:4px}
.quick input,.quick select{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff}
.quick input.grow{flex:1}
.empty{text-align:center;color:var(--muted);padding:22px 12px;font-size:13px}

/* signal/noise */
.sn-head{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-top:4px}
.sn-head .dot{width:8px;height:8px;border-radius:50%}
.dot.s{background:var(--signal)}.dot.n{background:var(--noise)}
.sn-head b{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.sn-head .hint{font-size:11px;color:var(--muted);font-weight:500}
.row.noise{opacity:.78}
.locked-note{font-size:11px;color:var(--signal);background:var(--signal-soft);padding:6px 10px;border-radius:8px;margin:4px 8px}

/* nudges */
.nudges{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.nudge{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:11px 14px;box-shadow:var(--shadow)}
.nudge.warn{border-left-color:var(--signal)}
.nudge svg{width:18px;height:18px;flex:0 0 18px}
.nudge .x{margin-left:auto}

/* suggestions */
.sugg{background:linear-gradient(135deg,#f5f6ff,#fbf7ff);border:1px solid #e6e6fb;border-radius:var(--radius);padding:14px 16px}
.sugg h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sugg h3 svg{width:16px;height:16px;color:var(--accent)}
.sugg .item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed #e1e1f5}
.sugg .item:first-of-type{border-top:none}
.sugg .item .txt{flex:1}.sugg .item .txt small{color:var(--muted)}
.outsource{font-size:12px;color:#b5532a;background:#fcefe8;border:1px solid #f3d7c7;border-radius:8px;padding:8px 11px;margin-top:8px}

/* goals + vision */
.goal-row{display:flex;align-items:center;gap:10px;padding:8px}
.vision-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:8px}
.vtile{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#f0f0ef;border:1px solid var(--line)}
.vtile img{width:100%;height:100%;object-fit:cover;display:block}
.vtile .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));
  color:#fff;font-size:11px;font-weight:600;padding:14px 8px 6px}
.vtile .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:none;color:#fff;border-radius:6px;width:24px;height:24px;opacity:0;transition:.12s}
.vtile:hover .del{opacity:1}
.vadd{display:flex;align-items:center;justify-content:center;border:1.5px dashed #cfcfcc;color:var(--muted);cursor:pointer;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.vadd:hover{border-color:var(--accent);color:var(--accent)}

/* free-form vision board */
.vboard{position:relative;height:660px;background:#fbfbfa;overflow:hidden;border-radius:0 0 var(--radius) var(--radius);
  background-image:radial-gradient(#e7e7e5 1px,transparent 1px);background-size:24px 24px;touch-action:none}
.vboard-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none;text-align:center;padding:0 20px}
.vitem{position:absolute;cursor:grab;border-radius:10px;box-shadow:var(--shadow);touch-action:none;user-select:none}
.vitem:active{cursor:grabbing}
.vitem.img{overflow:hidden;background:#eee}
.vitem.img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;border-radius:10px}
.vitem.text{box-shadow:none;background:transparent;border-radius:6px}
.vtext{width:100%;height:100%;outline:none;font-weight:700;font-size:22px;line-height:1.25;color:var(--ink);
  padding:6px 8px;overflow:hidden;cursor:grab;white-space:pre-wrap;word-break:break-word}
.vtext[contenteditable="true"]{cursor:text;background:rgba(255,255,255,.85);box-shadow:0 0 0 2px var(--accent);border-radius:6px}
.vitem .vdel{position:absolute;top:5px;right:5px;width:24px;height:24px;border:none;border-radius:6px;
  background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:.12s;z-index:2}
.vitem:hover .vdel{opacity:1}
.vitem .vrz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 48%,var(--accent) 48%);border-radius:0 0 10px 0;opacity:0;transition:.12s;z-index:2}
.vitem:hover .vrz{opacity:.95}
.vtext:empty:before{content:"Type your vision...";color:var(--muted);font-weight:600}
.vitem.loading{display:flex;align-items:center;justify-content:center;background:#eef0ff;border:1px dashed var(--accent)}
.vload{color:var(--accent);font-size:12px;font-weight:600}
.ndismiss{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center}
.ndismiss:hover{background:#f0f0ef;color:var(--ink)}

/* progress */
.prog{height:8px;border-radius:6px;background:#eee;overflow:hidden}
.prog > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.macro{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.macro .lab{display:flex;justify-content:space-between;font-size:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:16px}
.stat .n{font-size:28px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--muted);font-weight:500}

/* time blocking */
.cal{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.cal .hour{display:flex;border-top:1px solid var(--line);height:54px}
.cal .hour:first-child{border-top:none}
.cal .hlabel{flex:0 0 64px;font-size:11px;color:var(--muted);padding:4px 8px;border-right:1px solid var(--line);text-align:right}
.cal .htrack{flex:1;position:relative}
.cal .layer{position:absolute;inset:0}
.block{position:absolute;left:6px;right:6px;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:#fff;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.block small{display:block;font-weight:500;opacity:.9;font-size:11px}
.b-work{background:#5b6cff}.b-workout{background:#c87a3a}.b-sleep{background:#7a7d99}
.b-meal{background:#3a8c5e}.b-personal{background:#c75b91}.b-focus{background:#8a6cff}

/* workouts */
.wktop{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;position:sticky;top:8px;z-index:15;box-shadow:var(--shadow)}
.wktop .nm{font-weight:700;font-size:16px;line-height:1.2}
.wktop .nm small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.wktimer{margin-left:auto;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.exblock{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:#fff;box-shadow:var(--shadow)}
.exblock h3{font-size:16px;font-weight:700}
.exlast{font-size:12px;color:var(--muted);margin:2px 0 12px;display:flex;align-items:center;gap:6px}
.exlast b{color:#6f6e6a;font-weight:600}
.setrow{display:flex;align-items:center;gap:8px;padding:6px 0}
.setrow .setn{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#f0f0ef;color:#6f6e6a;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.setrow input{flex:1;min-width:0;width:100%;border:1px solid var(--line2);border-radius:10px;padding:12px 8px;font-size:16px;text-align:center;font-weight:600}
.setrow .xsep{color:var(--muted);font-weight:700;flex:0 0 auto}
.setrow .ulab{font-size:11px;color:var(--muted);flex:0 0 auto}
.setrow .setdone{flex:0 0 46px;height:46px;border:1.5px solid var(--line2);border-radius:12px;background:#fff;color:#cfcfcc;display:flex;align-items:center;justify-content:center;cursor:pointer}
.setrow.done .setdone{background:var(--ok);border-color:var(--ok);color:#fff}
.setrow.done input{background:var(--ok-soft);border-color:#cfe9da;color:#2c7a57}
.restbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(135deg,#fff,#fbf7ff);border:1px solid #ececeb;border-radius:14px;padding:12px 14px;margin:0 0 16px;position:sticky;top:78px;z-index:14;box-shadow:var(--shadow)}
.restbar .rl{font-weight:700;font-size:13px}
.restpreset{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
.restpreset.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.resttime{margin-left:auto;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.resttime.run{color:var(--accent)}
.wkbtns{display:flex;gap:10px;margin-top:18px}
.exadd{display:flex;gap:8px;margin-top:10px}
.exadd input{border:1px solid var(--line2);border-radius:9px;padding:10px 11px}
.exadd .nmin{flex:1;min-width:0}
.exadd .stin{width:74px;text-align:center}
.coachbtns{display:flex;flex-wrap:wrap;gap:8px}
.coachout{margin-top:14px;background:#f7f7f6;border:1px solid var(--line);border-radius:10px;padding:14px 16px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.coachout.thinking{color:var(--muted);font-style:italic}
.calfilters{display:flex;gap:8px;flex-wrap:wrap;margin:2px 4px 12px}
.calfilter{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;color:#54617a}
.calfilter.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* roadmap board */
.rtoolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 4px 12px}
.rselect{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:14px;font-weight:600;min-width:160px}
.rtag{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;color:var(--muted);background:#eef1f6;border-radius:6px;padding:1px 6px;vertical-align:middle}
.rboard{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.rboard{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.rboard{grid-template-columns:1fr}}
.rdot.d{background:#38d39f}
.rcol.rdone .rcard{opacity:.72}
.rcol{background:#f2f4f8;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px;transition:.12s}
.rcol.dragover{outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft)}
.rcolh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:2px 4px 12px}
.rcolh .rcount{margin-left:auto;color:var(--muted);font-weight:600}
.rdot{width:9px;height:9px;border-radius:50%;background:#9aa6b2}
.rdot.s{background:var(--signal)}.rdot.n{background:var(--noise)}
.rcards{display:flex;flex-direction:column;gap:8px;min-height:44px}
.rcard{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);cursor:grab;display:flex;align-items:center;gap:8px;touch-action:none}
.rcard:active{cursor:grabbing}
.rcard.dragging{opacity:.5;box-shadow:var(--shadow-lg)}
.rghost{position:fixed;z-index:9999;pointer-events:none;margin:0!important;box-shadow:0 12px 28px rgba(20,30,60,.28);transform:rotate(1.5deg) scale(1.02);opacity:.97;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:8px}
.rph{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:10px;transition:height .1s}
.rct{flex:1;font-weight:500;font-size:14px}
.rdel{border:none;background:none;color:#cfcfcc;cursor:pointer;padding:2px;display:flex;opacity:0}
.rcard:hover .rdel{opacity:1}
.rdel svg{width:15px;height:15px}
.rempty{color:var(--muted);font-size:12px;text-align:center;padding:14px 8px;border:1px dashed var(--line2);border-radius:8px}
.raddwrap{display:flex;gap:6px;margin-bottom:10px}
.raddwrap input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font-size:16px;background:#fff}
/* weight tracker */
.wthumb{width:50px;height:50px;flex:0 0 50px;border-radius:10px;object-fit:cover;cursor:zoom-in;background:#f0f0ef;border:1px solid var(--line)}
.wthumb.noimg{display:flex;align-items:center;justify-content:center;color:#c9c9c6;cursor:default}
.wthumb.noimg svg{width:22px;height:22px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,15,15,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:#6f6e6a}
.field input,.field select,.field textarea{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;width:100%}
.field .two{display:flex;gap:10px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* gate */
.gate{position:fixed;inset:0;background:radial-gradient(120% 120% at 50% 0,#eef0ff, #f7f7f5);display:flex;align-items:center;justify-content:center;z-index:200}
.gate .box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.12);padding:34px 30px;width:340px;text-align:center}
.gate .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#5b6cff,#8a6cff);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff}
.gate h2{font-size:18px;margin-bottom:4px}.gate p{color:var(--muted);font-size:13px;margin-bottom:18px}
.gate input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 13px;text-align:center;letter-spacing:2px;margin-bottom:12px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#37352f;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:300}
#toast.show{opacity:1}
.hide{display:none!important}

/* ---- dashboard layout ---- */
.dash-top{display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr);gap:18px;align-items:start}
.dash-bottom{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
@media(max-width:900px){.dash-top{grid-template-columns:1fr}}

/* ---- reorderable dashboard grid ---- */
.dashgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.dashgrid{grid-template-columns:1fr}}
.dsection{position:relative;min-width:0;display:flex;flex-direction:column;gap:18px}
.dsection.dragging{opacity:.45}
.dsection.dragover{outline:2px dashed var(--accent);outline-offset:4px;border-radius:14px}
.dtools{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:5px;opacity:0;transition:.12s}
.dsection:hover .dtools{opacity:1}
.dtool{width:28px;height:22px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line2);border-radius:7px;color:var(--muted);box-shadow:var(--shadow);cursor:pointer;padding:0}
.dtool:hover{color:var(--ink);background:#f4f4f3}
.dgrip{cursor:grab}.dgrip:active{cursor:grabbing}
.dtool svg{width:15px;height:15px}
.dsection.full{grid-column:1 / -1}

/* ---- boxed task / mission items ---- */
.tbox{display:flex;align-items:center;gap:11px;padding:12px 13px;margin:8px 6px;border:1px solid var(--line2);border-radius:11px;background:#fff;transition:.12s}
.tbox:hover{border-color:#d6d6d3;box-shadow:var(--shadow)}
.tbox:hover .row-acts{opacity:1}
.tbox.noise{background:#fafafa}
.tbox.done{background:#fbfdfb;border-color:#e3efe8}
.tbox .rt .t{font-weight:500}
.tbox .tgrip{flex:0 0 auto;color:#a9a9a6;cursor:grab;display:flex;align-items:center;justify-content:center;
  margin-left:-6px;padding:6px 4px;touch-action:none;border-radius:6px}
.tbox .tgrip:hover{color:var(--ink);background:#f0f0ef}
.tbox .tgrip:active{cursor:grabbing}
.tbox .tgrip svg{width:18px;height:18px}
.tbox.dragging{box-shadow:var(--shadow);background:#fff}
.tbox.dragging{opacity:.5}
.tbox.dragover{outline:2px dashed var(--accent);outline-offset:2px}

/* ---- add bar (full-width button) ---- */
.addbar{display:flex;flex-direction:column;gap:8px;padding:12px 6px 4px;border-top:1px solid var(--line);margin-top:8px}
.addbar .inrow{display:flex;gap:8px}
.addbar input,.addbar select{border:1px solid var(--line2);border-radius:9px;padding:10px 12px;background:#fff;min-width:0}
.addbar input.grow,.addbar select.grow{flex:1}
.btn.full{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;font-size:14px}

/* ---- responsive splits (time / food) ---- */
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.food-wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.food-main{display:flex;flex-direction:column;gap:18px}
@media(max-width:900px){.cal-wrap,.food-wrap{grid-template-columns:1fr}}
.prog>i.over{background:linear-gradient(90deg,#ff8a5b,#ff5b7f)}
.food-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.msec{margin-bottom:16px}
.msec-h{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:2px solid var(--line);margin-bottom:8px}
.msec-t{font-weight:700;font-size:14px}
.msec-k{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.msec-add{padding:4px 8px!important}
.msec-empty{color:var(--muted);font-size:12px;padding:6px 4px 10px}
.food-actions .btn{flex:1 1 auto}
.scanbox{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:220px}
.scanbox video{width:100%!important;height:auto!important;display:block}
.aihint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.aihint svg{flex:none}
.aiprev{max-width:100%;max-height:180px;border-radius:10px;margin-bottom:10px;display:block}
.spark{display:flex;align-items:flex-end;gap:5px;height:44px;padding:6px 2px 0}
.sparkcol{flex:1;display:flex;align-items:flex-end;justify-content:center}
.sparkcol>i{width:100%;max-width:16px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#9b6dff,#635bff)}
.sparkcol>i.hit{background:linear-gradient(180deg,#38d39f,#1fae7e)}

.daynav button{display:flex;align-items:center;justify-content:center}

/* ---- mobile ---- */
@media(max-width:760px){
  #app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .sidebar{width:100%;flex:0 0 auto;border-right:none;border-bottom:1px solid var(--line);padding:12px 12px 10px}
  .brand{padding:4px 6px 10px}
  .sidebar .nav{flex-direction:row;flex-wrap:wrap}
  .nav .label{display:none}
  .nav button{width:auto;padding:8px 12px}
  .side-foot{display:none}
  .main{overflow:visible}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:18px}
  .wrap{padding:16px 14px 56px}
  .cal .hlabel{flex:0 0 50px}
  .stat .n{font-size:24px}
  .row-acts{opacity:1}
}

/* ===================== PREMIUM POLISH ===================== */

  --shadow:0 1px 2px rgba(17,17,26,.04),0 6px 18px rgba(17,17,26,.06);

body{background:linear-gradient(180deg,#f7f7f6 0%,#f2f2f5 100%)}
.card{border-color:#ededec;box-shadow:var(--shadow);transition:box-shadow .22s ease}

.card-h h2{letter-spacing:-.2px}
.card-h .ic{filter:drop-shadow(0 1px 2px rgba(91,108,255,.25))}
.btn{transition:transform .12s ease, box-shadow .15s ease, background .15s ease, filter .15s ease}

.brand .logo,.gate .logo{box-shadow:0 8px 20px rgba(91,108,255,.35)}
.nav button.active{box-shadow:0 2px 8px rgba(17,17,26,.06)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,108,255,.14)}
.chk{transition:transform .18s cubic-bezier(.2,.9,.3,1.5),background .15s,border-color .15s,box-shadow .15s}
.chk.done{box-shadow:0 2px 8px rgba(58,166,117,.35)}
.chk svg{transition:opacity .15s ease, transform .18s ease}
.chk.done svg{transform:scale(1.06)}
.tbox{transition:transform .14s ease, box-shadow .15s ease, border-color .15s ease}
.tbox:hover{transform:translateY(-1px)}

.prog>i{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pbar{height:4px;background:#ececef;overflow:hidden}

.card-h .count{background:#f0f0ef;padding:2px 10px;border-radius:20px;transition:.2s;font-variant-numeric:tabular-nums}
.card-h .count.alldone{background:var(--ok-soft);color:var(--ok)}
.wkprogwrap{margin:0 0 16px}
.wkprogwrap .pbar{border-radius:8px;height:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.wkproglab{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.main::-webkit-scrollbar{width:12px}
.main::-webkit-scrollbar-thumb{background:#dcdcda;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.main::-webkit-scrollbar-thumb:hover{background:#cbcbc8;background-clip:padding-box}

</style>

<script type="text/template" id="app-script">
// ===================== CONSTANTS =====================

function svg(p,cls){return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="'+(cls||'')+'">'+p+'</svg>';}

// ===================== STATE =====================
const state = { view:'dashboard', date:todayStr(), settings:null, account:'lewis', full:true, calFilter:'mine' };

// ===================== HELPERS =====================
function todayStr(){const d=new Date();return ymd(d);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d);}
function parseDate(s){return new Date(s+'T00:00');}
function dow(s){return parseDate(s).getDay();}
function isToday(s){return s===todayStr();}
function prettyDate(s){const d=parseDate(s);return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
function shortDate(s){const d=parseDate(s);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function nowHM(){const d=new Date();return d.getHours()+d.getMinutes()/60;}
function hm(t){if(!t)return null;const p=t.split(':');return parseInt(p[0])+parseInt(p[1])/60;}
function fmtTime(t){if(!t)return '';const p=t.split(':');let h=parseInt(p[0]);const m=p[1];const ap=h>=12?'pm':'am';h=h%12||12;return h+(m!=='00'?':'+m:'')+ap;}
function el(id){return document.getElementById(id);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function titleCase(s){return (s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}

async function q(table){return sb.from(table);}

// ===================== AUTH GATE =====================
function applyAccount(a){state.account=a.id;state.full=a.full;}
function accountLabel(id){return id==='lewis'?'Lewis Account':'Yasmin Account';}
function partnerId(){return state.account==='lewis'?'yasmin':'lewis';}
function partnerLabel(){return accountLabel(partnerId());}
function checkGate(){
  const acc=localStorage.getItem('dc_account');
  if(localStorage.getItem('dc_unlocked')==='1' && acc){
    applyAccount({id:acc,full:acc==='lewis'});openApp();
  }
}
function tryUnlock(){
  const v=(el('passInput').value||'').trim().toLowerCase();
  const a=ACCOUNTS[v];
  if(a){localStorage.setItem('dc_unlocked','1');localStorage.setItem('dc_account',a.id);applyAccount(a);openApp();}
  else{toast('Wrong passcode');el('passInput').value='';}
}
function lock(){localStorage.removeItem('dc_unlocked');localStorage.removeItem('dc_account');location.reload();}
async function openApp(){
  el('gate').classList.add('hide');
  el('app').classList.remove('hide');

async function loadSettings(){
  const {data}=await sb.from('dc_settings').select('*').eq('id',1).single();
  return data||{cal_target:2200,protein_target:160,carbs_target:220,fat_target:70,
    wake_time:'07:00',sleep_time:'23:00',workhours_start:'09:00',workhours_end:'18:00'};

// ===================== NAV =====================
const NAVS=[
  {k:'dashboard',t:'Dashboard',i:I.dash},
  {k:'workouts',t:'Workouts',i:I.dumbbell},
  {k:'weight',t:'Weight',i:I.scale},
  {k:'calendar',t:'Calendar',i:I.cal},
  {k:'roadmap',t:'Roadmap',i:I.board},
  {k:'todo',t:'To-Do',i:I.list},
  {k:'food',t:'Food tracker',i:I.food}
];
function buildNav(){

// ===================== DASHBOARD =====================
async function ensureTasksFor(date){
  // Never auto-generate tasks for past days (that was duplicating onto yesterday).
  if(date < todayStr()) return;
  const d=dow(date);
  const [{data:routines},{data:existing},{data:tpls}]=await Promise.all([
    sb.from('dc_routines').select('*').eq('active',true),
    sb.from('dc_tasks').select('routine_id,template_id').eq('scheduled_date',date),
    sb.from('dc_workout_templates').select('id,name').eq('weekday',d).eq('owner',state.account)
  ]);
  const haveR=new Set((existing||[]).filter(r=>r.routine_id).map(r=>r.routine_id));
  const haveT=new Set((existing||[]).filter(r=>r.template_id).map(r=>r.template_id));
  const add=[];
  for(const r of (routines||[])){
    if(haveR.has(r.id))continue;
    if(isDue(r,d))add.push({routine_id:r.id,title:r.title,category:r.category,scheduled_date:date,scheduled_time:r.default_time,sort_order:r.sort_order});
  }
  // scheduled workout sessions for this weekday auto-add as a to-do
  for(const tp of (tpls||[])){
    if(haveT.has(tp.id))continue;
    add.push({template_id:tp.id,title:tp.name,category:'workout',scheduled_date:date,sort_order:-1});
  }
  if(add.length)await sb.from('dc_tasks').insert(add);
}
function isDue(r,d){
  if(r.recurrence==='daily')return true;
  if(r.recurrence==='weekdays')return d>=1&&d<=5;
  if(r.recurrence==='weekends')return d===0||d===6;
  if(r.recurrence==='weekly'||r.recurrence==='custom')return (r.weekdays||[]).includes(d);
  return false;
}

  await ensureDailyTasks();

  const [tasks,missions,vision] = await Promise.all([

    + '<div class="dashgrid" id="dashgrid">'+getDashOrder().map(k=>sections[k]).join('')+'</div>';

// ---- Mission (signal/noise) ----
function missionCard(M){
  const signals=M.filter(m=>m.priority==='signal');
  const noise=M.filter(m=>m.priority==='noise');
  const signalsDone=signals.length&&signals.every(m=>m.status==='done');
  function mrow(m,isNoise){
    const d=m.status==='done';
    return '<div class="tbox '+(isNoise?'noise':'')+' '+(d?'done':'')+'">'
      +'<div class="chk '+(d?'done':'')+'" onclick="toggleMission(this,\''+m.id+'\',\''+m.status+'\')">'+svg(I.check)+'</div>'
      +'<div class="rt '+(d?'done':'')+'"><div class="t">'+esc(m.title)+'</div></div>'
      +'<div class="row-acts">'
        +'<button class="btn ghost sm" title="Move to tomorrow" onclick="moveMission(\''+m.id+'\')">'+svg(I.move,'')+'</button>'
        +'<button class="btn ghost sm" title="Delete" onclick="deleteMission(\''+m.id+'\')">'+svg(I.trash,'')+'</button>'
      +'</div></div>';
  }
  let body='<div class="sn-head"><span class="dot s"></span><b>Signals</b><span class="hint">move the needle</span></div>';
  body += signals.length?signals.map(m=>mrow(m,false)).join(''):'<div class="empty">No signals yet. What is the one thing that matters most today?</div>';
  body += '<div class="sn-head" style="margin-top:10px"><span class="dot n"></span><b>Noise</b><span class="hint">necessary, low-impact</span></div>';
  if(noise.length && !signalsDone && signals.length) body+='<div class="locked-note">Knock out your signals first. Noise can wait.</div>';
  body += noise.length?noise.map(m=>mrow(m,true)).join(''):'<div class="empty" style="padding:10px">Nothing here.</div>';
  const sigDone=signals.filter(m=>m.status==='done').length;
  const sigPct=signals.length?Math.round(sigDone/signals.length*100):0;
  const sigAll=signals.length&&sigDone===signals.length;
  return '<div class="card" id="card-mission">'
    +'<div class="card-h">'+svg(I.target,'ic')+'<h2>Mission &middot; Signal vs Noise</h2>'+(signals.length?'<span class="count'+(sigAll?' alldone':'')+'">'+sigDone+'/'+signals.length+' signals</span>':'')+'</div>'
    +'<div class="pbar'+(sigAll?' done':'')+'" data-sig="1"><i style="width:'+sigPct+'%"></i></div>'
    +'<div class="card-b">'+body
      +'<div class="addbar">'
        +'<input class="grow" id="nmTitle" placeholder="Add a work task...">'
        +'<div class="inrow">'
          +'<select id="nmPri" class="grow"><option value="signal">Signal -- high impact</option><option value="noise">Noise -- low impact</option></select>'
        +'</div>'
        +'<button class="btn primary full" onclick="addMission()">'+svg(I.plus,'')+' Let&#39;s Go</button>'
      +'</div>'
    +'</div></div>';
}

// ---- Suggestions (heuristic) ----
async function missionSuggestions(todayM){
  const since=addDays(todayStr(),-21);
  const {data}=await sb.from('dc_missions').select('category,title,scheduled_date').gte('scheduled_date',since);
  const rows=data||[];
  if(rows.length<3) return null;
  const todayTitles=new Set(todayM.map(m=>m.title.toLowerCase()));
  const catCount={},titleCount={};
  rows.forEach(r=>{catCount[r.category]=(catCount[r.category]||0)+1;
    const k=r.title.toLowerCase().trim();titleCount[k]=(titleCount[k]||0)+1;});
  const topCats=Object.entries(catCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const repeats=Object.entries(titleCount).filter(([k,c])=>c>=4).sort((a,b)=>b[1]-a[1]);
  const suggCats=topCats.filter(([c])=>!todayM.some(m=>m.category===c)).slice(0,2);
  return {suggCats, repeats:repeats.slice(0,2), total:rows.length};
}
function suggCard(s){
  let items = s.suggCats.length? s.suggCats.map(([c,n])=>
    '<div class="item"><div class="txt">'+titleCase(c)+' <small>&middot; done '+n+'x in last 3 weeks</small></div>'
    +'<button class="btn sm primary" onclick="quickAddMission(\''+c+'\')">'+svg(I.plus,'')+' Add</button></div>').join('')
    : '<div class="item"><div class="txt"><small>You are covering your usual categories today. Nice.</small></div></div>';
  let out = s.repeats.length? '<div class="outsource">'+svg(I.spark,'')+' <b>Outsourcing tip:</b> you have repeated &quot;'+esc(titleCase(s.repeats[0][0]))+'&quot; '+s.repeats[0][1]+' times recently. This looks delegable -- consider handing it off so you can stay on signals.</div>':'';
  return '<div class="sugg"><h3>'+svg(I.spark)+'Morning suggestions</h3>'
    +'<div style="font-size:12px;color:#7a7975;margin-bottom:6px">Based on '+s.total+' tasks over the last 3 weeks.</div>'
    +items+out+'</div>';
}

async function addRoutine(){
  const t=el('ndTask').value.trim();if(!t)return;
  const cat=el('ndCat').value,rec=el('ndRec').value;
  await sb.from('dc_routines').insert({title:t,category:cat,recurrence:rec});
  await ensureTasksFor(state.date);
  toast('Routine added');
  await refreshTodo();
}
async function toggleTask(node,id,status){
  const nowDone=status!=='done';const box=node.closest('.tbox');
  node.classList.toggle('done',nowDone);box.classList.toggle('done',nowDone);
  const rt=box.querySelector('.rt');if(rt)rt.classList.toggle('done',nowDone);
  node.setAttribute('onclick',"toggleTask(this,'"+id+"','"+(nowDone?'done':'pending')+"')");
  updateCount('card-todo');
  await sb.from('dc_tasks').update({status:nowDone?'done':'pending',completed_at:nowDone?new Date().toISOString():null}).eq('id',id);
}
async function moveTask(id){
  const {data:t}=await sb.from('dc_tasks').select('routine_id,template_id,title,category,sort_order').eq('id',id).single();
  const target=addDays(state.date,1);
  // For routine- or plan-backed tasks, leave a skipped tombstone on the source day
  // so it does not auto-regenerate there -- keeps the task on ONE day only.
  if(t&&(t.routine_id||t.template_id)){
    await sb.from('dc_tasks').insert({routine_id:t.routine_id||null,template_id:t.template_id||null,title:t.title,category:t.category,scheduled_date:state.date,status:'skipped',sort_order:t.sort_order});
  }
  await sb.from('dc_tasks').update({scheduled_date:target,status:'pending'}).eq('id',id);
  toast('Moved to '+shortDate(target));await refreshTodo();
}
async function deleteTask(id){
  const {data:t}=await sb.from('dc_tasks').select('routine_id,template_id').eq('id',id).single();
  if(!t){await refreshTodo();return;}
  if(t.routine_id){
    if(!confirm('Delete this routine? It will stop appearing each day.'))return;
    await sb.from('dc_routines').delete().eq('id',t.routine_id);
    await sb.from('dc_tasks').delete().eq('id',id);
    toast('Routine deleted');
  } else if(t.template_id){
    // workout session to-do: tombstone so it does not regenerate today (plan stays)
    await sb.from('dc_tasks').update({status:'skipped'}).eq('id',id);
    toast('Removed from today');
  } else {
    await sb.from('dc_tasks').delete().eq('id',id);
    toast('Task deleted');
  }
  await refreshTodo();
}

  const t=el('nmTitle').value.trim();if(!t)return;

// ---- dashboard section ordering (drag to reorder, persisted per device) ----
const DASH_KEYS=['month','todo','mission','vision'];
function getDashOrder(){try{const a=JSON.parse(localStorage.getItem('dc_dash_order')||'[]').filter(k=>DASH_KEYS.includes(k));DASH_KEYS.forEach(k=>{if(!a.includes(k))a.push(k);});return a;}catch(e){return DASH_KEYS.slice();}}
function saveDashOrder(a){localStorage.setItem('dc_dash_order',JSON.stringify(a));}
function getDashFull(){try{return JSON.parse(localStorage.getItem('dc_dash_full')||'["month","vision"]').filter(k=>DASH_KEYS.includes(k));}catch(e){return ['month','vision'];}}
function saveDashFull(a){localStorage.setItem('dc_dash_full',JSON.stringify(a));}
function toggleWide(key){
  const set=getDashFull();const i=set.indexOf(key);
  if(i>=0)set.splice(i,1);else set.push(key);
  saveDashFull(set);
  const s=document.querySelector('.dsection[data-key="'+key+'"]');
  if(s)s.classList.toggle('full',set.includes(key));
}
function initDashGrid(){
  const grid=el('dashgrid');if(!grid||grid._wired)return;grid._wired=true;
  let dragKey=null;
  grid.addEventListener('mousedown',e=>{const g=e.target.closest('.dgrip');if(!g)return;const s=g.closest('.dsection');if(s)s.setAttribute('draggable','true');});
  grid.addEventListener('mouseup',()=>{[...grid.children].forEach(c=>c.setAttribute('draggable','false'));});
  grid.addEventListener('dragstart',e=>{const s=e.target.closest('.dsection');if(!s)return;if(s.getAttribute('draggable')!=='true')return;dragKey=s.dataset.key;s.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragKey);}catch(_){}});
  grid.addEventListener('dragover',e=>{if(!dragKey)return;e.preventDefault();const s=e.target.closest('.dsection');[...grid.children].forEach(c=>c.classList.toggle('dragover',c===s&&c.dataset.key!==dragKey));});
  grid.addEventListener('drop',e=>{
    if(!dragKey)return;e.preventDefault();
    const target=e.target.closest('.dsection');const dragged=grid.querySelector('.dsection[data-key="'+dragKey+'"]');
    if(target&&dragged&&target!==dragged){const items=[...grid.children];
      if(items.indexOf(dragged)<items.indexOf(target))target.after(dragged);else target.before(dragged);
      saveDashOrder([...grid.children].map(c=>c.dataset.key));}
    finishDrag();
  });
  grid.addEventListener('dragend',finishDrag);
  function finishDrag(){[...grid.children].forEach(c=>{c.classList.remove('dragover','dragging');c.setAttribute('draggable','false');});dragKey=null;}
}
// drag-to-reorder the individual to-do items within the list.
// Uses pointer events (works with mouse AND touch) -- HTML5 drag was unreliable
// on desktop and didn't work at all on mobile.
function wireTodoDnD(){
  const list=el('todoList');if(!list||list._wired)return;list._wired=true;
  let dragEl=null,startY=0,active=false,pid=null;
  list.addEventListener('pointerdown',e=>{
    const grip=e.target.closest('.tgrip');if(!grip)return;
    dragEl=grip.closest('.tbox');if(!dragEl)return;
    startY=e.clientY;active=false;pid=e.pointerId;
    try{list.setPointerCapture(pid);}catch(_){}
    e.preventDefault();
  });
  list.addEventListener('pointermove',e=>{
    if(!dragEl)return;
    if(!active){if(Math.abs(e.clientY-startY)<5)return;active=true;dragEl.classList.add('dragging');}
    e.preventDefault();
    const sibs=[...list.querySelectorAll('.tbox')].filter(x=>x!==dragEl);
    let placed=false;
    for(const s of sibs){const r=s.getBoundingClientRect();if(e.clientY<r.top+r.height/2){list.insertBefore(dragEl,s);placed=true;break;}}
    if(!placed)list.appendChild(dragEl);
  });
  async function endTodo(){
    if(!dragEl)return;
    const wasActive=active;dragEl.classList.remove('dragging');
    try{list.releasePointerCapture(pid);}catch(_){}
    dragEl=null;active=false;
    if(!wasActive)return;
    const ids=[...list.querySelectorAll('.tbox')].map(c=>c.dataset.id);
    for(let i=0;i<ids.length;i++){await sb.from('dc_tasks').update({sort_order:i}).eq('id',ids[i]);}
  }
  list.addEventListener('pointerup',endTodo);
  list.addEventListener('pointercancel',endTodo);
}

// ---- vision upload ----
function clearVboardEmpty(board){const e=board.querySelector('.vboard-empty');if(e)e.remove();}
async function uploadVision(input){
  const file=input.files[0];if(!file)return;
  const board=el('vboard');if(!board)return;
  clearVboardEmpty(board);
  const n=board.querySelectorAll('.vitem').length;const off=(n%6)*26;
  const x=30+off,y=30+off,w=240,h=200,z=n+1;
  // instant placeholder so it feels responsive while the upload runs
  const tmp='tmp'+Date.now();
  board.insertAdjacentHTML('beforeend','<div class="vitem img loading" data-tmp="'+tmp+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;z-index:'+z+'"><div class="vload">Uploading...</div></div>');
  input.value='';
  const path=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'');
  const up=await sb.storage.from(VBUCKET).upload(path,file,{upsert:true});
  const ph=board.querySelector('[data-tmp="'+tmp+'"]');
  if(up.error){if(ph)ph.remove();toast('Upload failed');return;}
  const {data}=sb.storage.from(VBUCKET).getPublicUrl(path);
  const ins=await sb.from('dc_vision').insert({kind:'image',image_url:data.publicUrl,x,y,w,h,z}).select().single();
  if(ins.error){if(ph)ph.remove();toast('Could not save image');return;}
  if(ph)ph.outerHTML=vitemHTML(ins.data); else board.insertAdjacentHTML('beforeend',vitemHTML(ins.data));
  toast('Image added');
}
async function addVisionText(){
  const board=el('vboard');if(!board)return;
  clearVboardEmpty(board);
  const n=board.querySelectorAll('.vitem').length;
  const ins=await sb.from('dc_vision').insert({kind:'text',content:'',x:40,y:40,w:240,h:70,z:n+1}).select().single();
  if(ins.error){toast('Could not add text');return;}
  board.insertAdjacentHTML('beforeend',vitemHTML(ins.data));

  if(t){t.contentEditable='true';t.focus();}
  toast('Type your vision, click away to save');
}
async function delVision(id,url){
  if(!confirm('Remove this item?'))return;
  const board=el('vboard');const it=board&&board.querySelector('.vitem[data-id="'+id+'"]');if(it)it.remove();
  await sb.from('dc_vision').delete().eq('id',id);
  try{const p=(url||'').split('/'+VBUCKET+'/')[1];if(p)await sb.storage.from(VBUCKET).remove([p]);}catch(e){}
}
// ---- free-form board interactions (drag / resize / text / z-order) ----
// Delegated so dynamically-added items work without re-rendering the dashboard.
function initVisionBoard(){
  const board=el('vboard');if(!board||board._wired)return;board._wired=true;
  let drag=null;
  board.addEventListener('pointerdown',e=>{
    const item=e.target.closest('.vitem');if(!item)return;
    if(e.target.closest('.vdel'))return;
    if(e.target.isContentEditable)return; // editing text: allow caret, no drag
    const isRz=!!e.target.closest('.vrz');
    const r=item.getBoundingClientRect();
    drag={item,pid:e.pointerId,mode:isRz?'resize':'move',active:isRz,sx:e.clientX,sy:e.clientY,
      ox:parseFloat(item.style.left)||0,oy:parseFloat(item.style.top)||0,ow:r.width,oh:r.height};
  });
  board.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.active){ if(Math.abs(dx)+Math.abs(dy)<4)return; drag.active=true; bringToFront(drag.item); try{drag.item.setPointerCapture(drag.pid);}catch(_){} }
    if(drag.mode==='move'){
      drag.item.style.left=Math.max(0,drag.ox+dx)+'px';
      drag.item.style.top=Math.max(0,drag.oy+dy)+'px';
    }else{
      drag.item.style.width=Math.max(60,drag.ow+dx)+'px';
      drag.item.style.height=Math.max(40,drag.oh+dy)+'px';
    }
  });
  async function endDrag(){
    if(!drag)return;const d=drag;drag=null;
    if(!d.active)return; // a click, nothing moved
    const it=d.item;const r=it.getBoundingClientRect();
    await sb.from('dc_vision').update({x:Math.round(parseFloat(it.style.left)||0),y:Math.round(parseFloat(it.style.top)||0),
      w:Math.round(r.width),h:Math.round(r.height)}).eq('id',it.dataset.id);
  }
  board.addEventListener('pointerup',endDrag);
  board.addEventListener('pointercancel',endDrag);
  board.addEventListener('dblclick',e=>{
    const t=e.target.closest('.vtext');if(!t)return;
    t.contentEditable='true';t.focus();
    const sel=window.getSelection();sel.selectAllChildren(t);
  });
  // save as you type (debounced) so text persists even if blur doesn't fire
  let saveT=null;
  board.addEventListener('input',e=>{
    const t=e.target.closest&&e.target.closest('.vtext');if(!t)return;
    const id=t.closest('.vitem').dataset.id;const val=t.innerText;
    clearTimeout(saveT);saveT=setTimeout(async()=>{await sb.from('dc_vision').update({content:val}).eq('id',id);},500);
  });
  board.addEventListener('focusout',async e=>{
    const t=e.target.closest&&e.target.closest('.vtext');if(!t||t.contentEditable!=='true')return;
    t.contentEditable='false';
    await sb.from('dc_vision').update({content:t.innerText}).eq('id',t.closest('.vitem').dataset.id);
  });
}
async function bringToFront(item){
  const board=el('vboard');if(!board)return;
  const max=Math.max(0,...[...board.querySelectorAll('.vitem')].map(x=>parseInt(x.style.zIndex)||0));
  if((parseInt(item.style.zIndex)||0)===max)return;
  item.style.zIndex=max+1;
  await sb.from('dc_vision').update({z:max+1}).eq('id',item.dataset.id);
}

// ===================== NUDGES =====================
async function computeNudges(T,M){
  const out=[];
  if(!isToday(state.date)) return out;
  const now=nowHM();const h=new Date().getHours();
  const overdue=T.filter(t=>t.status==='pending'&&t.scheduled_time&&hm(t.scheduled_time)<now);
  if(overdue.length) out.push({warn:true,t:overdue.length+' routine'+(overdue.length>1?'s are':' is')+' past due: '+overdue.slice(0,2).map(x=>x.title).join(', ')});
  const sig=M.filter(m=>m.priority==='signal');
  if(sig.length&&sig.every(m=>m.status==='done')) out.push({warn:false,t:'All signals cleared. Strong day -- noise is fair game now.'});
  else if(sig.length&&h>=12&&!sig.some(m=>m.status==='done')) out.push({warn:true,t:'It is past noon and no signal is done yet. Protect your focus -- start the one that matters.'});
  // meals
  const {data:food}=await sb.from('dc_nutrition_meals').select('meal_type').eq('meal_date',state.date);
  const meals=new Set((food||[]).map(x=>(x.meal_type||'').toLowerCase()));
  if(h>=14&&!meals.has('lunch')) out.push({warn:true,t:'No lunch synced yet. Check the Food tracker to keep things honest.'});
  if(h>=20&&!meals.has('dinner')) out.push({warn:true,t:'Dinner not synced. Log it in your nutrition app before the day closes.'});
  // workout
  const woTask=T.find(t=>t.category==='workout'&&t.status==='pending');
  const {data:wo}=await sb.from('dc_workouts').select('id').eq('workout_date',state.date);
  if(woTask&&!(wo||[]).length&&h>=17) out.push({warn:true,t:'Workout still pending. Lock in a slot in Time-blocking so it does not slip.'});
  // upcoming block
  const {data:blocks}=await sb.from('dc_timeblocks').select('*').eq('block_date',state.date);
  const up=(blocks||[]).map(b=>({b,s:hm(b.start_time)})).filter(x=>x.s>now&&x.s-now<=0.5).sort((a,b)=>a.s-b.s)[0];
  if(up) out.push({warn:false,t:'Coming up at '+fmtTime(up.b.start_time)+': '+up.b.title});
  const dis=getDismissed();
  return out.map(n=>({warn:n.warn,t:n.t,id:hashStr(n.t)})).filter(n=>!dis.includes(n.id));
}
function nudgeHtml(n){
  return '<div class="nudge '+(n.warn?'warn':'')+'" data-id="'+n.id+'">'+svg(n.warn?I.bell:I.spark,'')
    +'<span>'+esc(n.t)+'</span>'
    +'<button class="ndismiss" title="Dismiss" onclick="dismissNudge(\''+n.id+'\')">'+svg(I.x,'')+'</button></div>';
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return 'n'+(h>>>0);}
function dismissedKey(){return 'dc_dismissed_'+state.date;}
function getDismissed(){try{return JSON.parse(localStorage.getItem(dismissedKey())||'[]');}catch(e){return [];}}
function dismissNudge(id){
  const arr=getDismissed();if(!arr.includes(id)){arr.push(id);localStorage.setItem(dismissedKey(),JSON.stringify(arr));}
  const node=document.querySelector('.nudge[data-id="'+id+'"]');
  if(node){const cont=node.parentElement;node.remove();if(cont&&!cont.querySelector('.nudge'))cont.remove();}
}

// ===================== TIME-BLOCKING =====================
async function renderTime(v){
  const date=state.date;
  const s=state.settings;
  const startH=Math.max(0,parseInt((s.wake_time||'06:00').split(':')[0]));
  const endH=Math.min(24,parseInt((s.sleep_time||'23:00').split(':')[0])+1);
  const [blocksR,missionsR]=await Promise.all([
    sb.from('dc_timeblocks').select('*').eq('block_date',date).order('start_time'),
    sb.from('dc_missions').select('*').eq('scheduled_date',date).eq('priority','signal')
  ]);
  const blocks=blocksR.data||[];
  const tip=workTimeTip(s,blocks);
  let hours='';
  for(let hh=startH;hh<endH;hh++){
    hours+='<div class="hour"><div class="hlabel">'+fmtTime(String(hh).padStart(2,'0')+':00')+'</div><div class="htrack"></div></div>';
  }
  const pxPerHour=54;
  const blockEls=blocks.map(b=>{
    const top=(hm(b.start_time)-startH)*pxPerHour;
    const height=Math.max(22,(hm(b.end_time)-hm(b.start_time))*pxPerHour-4);
    return '<div class="block b-'+b.type+'" style="top:'+top+'px;height:'+height+'px" onclick="delBlock(\''+b.id+'\')" title="Click to delete">'
      +esc(b.title)+'<small>'+fmtTime(b.start_time)+' - '+fmtTime(b.end_time)+'</small></div>';
  }).join('');
  v.innerHTML =
    '<div class="cal-wrap">'
    +'<div class="cal"><div style="position:relative">'+hours
      +'<div class="layer" style="left:64px">'+blockEls+'</div>'
    +'</div></div>'
    +'<div style="display:flex;flex-direction:column;gap:18px">'
      +'<div class="card"><div class="card-h">'+svg(I.plus,'ic')+'<h2>Add a block</h2></div><div class="card-b" style="padding:14px">'
        +'<div class="field"><input id="tbTitle" placeholder="Block title (e.g. Deep work)"></div>'
        +'<div class="field" style="margin-top:10px"><div class="two">'
          +'<input id="tbStart" type="time" value="09:00"><input id="tbEnd" type="time" value="10:30"></div></div>'
        +'<div class="field" style="margin-top:10px"><select id="tbType">'
          +'<option value="work">Work</option><option value="focus">Deep focus</option><option value="workout">Workout</option>'
          +'<option value="meal">Meal</option><option value="sleep">Sleep</option><option value="personal">Personal</option></select></div>'
        +'<button class="btn primary" style="width:100%;margin-top:12px" onclick="addBlock()">'+svg(I.plus,'')+' Add block</button>'
      +'</div></div>'
      +'<div class="sugg"><h3>'+svg(I.spark)+'Maximize work hours</h3>'+tip+'</div>'
    +'</div></div>';
}
function workTimeTip(s,blocks){
  const wake=fmtTime(s.wake_time),sleep=fmtTime(s.sleep_time);
  const woStart=s.wake_time;const woEnd=addMin(s.wake_time,60);
  return '<div style="font-size:13px;color:#555;line-height:1.6">'
    +'You are awake '+wake+' to '+sleep+'. To protect the most unbroken work time:'
    +'<div style="margin-top:8px"><b>Workout:</b> right after waking ('+fmtTime(woStart)+'-'+fmtTime(woEnd)+') -- it is done before the workday and frees your afternoon for signals.</div>'
    +'<div style="margin-top:6px"><b>Sleep:</b> aim for lights out by '+sleep+' to keep a full early block tomorrow.</div>'
    +'<div style="margin-top:6px"><b>Deep work:</b> stack your hardest signal in your first 2 work hours, before meetings and noise creep in.</div>'
    +'<button class="btn primary full" style="margin-top:12px" onclick="autoSchedule()">'+svg(I.spark,'')+' Auto-build my full day</button>'
    +'<div style="margin-top:6px;font-size:11px;color:#8a8985">Adds workout, deep work, lunch, focus, wind-down and sleep at '+sleep+'.</div>'
    +'</div>';
}
function addMin(t,m){const x=hm(t)+m/60;const h=Math.floor(x);const mm=Math.round((x-h)*60);return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
async function autoSchedule(){
  const s=state.settings;const date=state.date;
  const plan=[
    {title:'Workout',start:s.wake_time,end:addMin(s.wake_time,60),type:'workout'},
    {title:'Deep work (top signal)',start:addMin(s.wake_time,90),end:addMin(s.wake_time,210),type:'focus'},
    {title:'Lunch',start:'12:30',end:'13:15',type:'meal'},
    {title:'Focused work',start:'13:30',end:'15:30',type:'work'},
    {title:'Admin / noise',start:'15:30',end:'16:30',type:'work'},
    {title:'Wind down',start:addMin(s.sleep_time,-60),end:s.sleep_time,type:'personal'},
    {title:'Sleep',start:s.sleep_time,end:addMin(s.sleep_time,30),type:'sleep'}
  ];
  const rows=plan.map(b=>({title:b.title,block_date:date,start_time:b.start,end_time:b.end,type:b.type}));
  await sb.from('dc_timeblocks').insert(rows);
  toast('Built your full day -- tweak any block as needed');navigate('time');
}
async function addBlock(){

  await sb.from('dc_timeblocks').insert({title:t,block_date:state.date,start_time:el('tbStart').value,end_time:el('tbEnd').value,type:el('tbType').value});
  el('tbTitle').value='';navigate('time');

async function delBlock(id){await sb.from('dc_timeblocks').delete().eq('id',id);navigate('time');}

      const sets=exs.reduce((a,e)=>a+(e.target_sets||0),0);

async function startWorkout(tid){
  const {data:t}=await sb.from('dc_workout_templates').select('name').eq('id',tid).single();
  const {data:s}=await sb.from('dc_workout_sessions').insert({template_id:tid,name:t?t.name:'Workout',session_date:todayStr(),started_at:new Date().toISOString(),completed:false,owner:state.account}).select().single();
  if(!s){toast('Could not start');return;}
  localStorage.setItem('dc_active_session',s.id);
  state.activeWorkout={id:s.id,name:s.name,startedAt:Date.now(),templateId:tid,date:s.session_date};

async function renderActiveWorkout(v){
  const aw=state.activeWorkout;
  const {data:s}=await sb.from('dc_workout_sessions').select('*, dc_workout_templates(name, dc_template_exercises(*))').eq('id',aw.id).single();
  if(!s){state.activeWorkout=null;localStorage.removeItem('dc_active_session');return renderWorkouts(v);}
  aw.startedAt=new Date(s.started_at).getTime();aw.templateId=s.template_id;aw.date=s.session_date;
  const tpl=s.dc_workout_templates;
  const exs=((tpl&&tpl.dc_template_exercises)||[]).slice().sort((a,b)=>(a.sort_order-b.sort_order)||(new Date(a.created_at)-new Date(b.created_at)));
  const names=exs.map(e=>e.name);
  const [logsR,histR]=await Promise.all([
    sb.from('dc_set_logs').select('*').eq('session_id',aw.id),
    names.length?sb.from('dc_set_logs').select('exercise_name,weight,reps,session_id,created_at,done').eq('owner',state.account).in('exercise_name',names).eq('done',true).neq('session_id',aw.id).order('created_at',{ascending:false}).limit(300):Promise.resolve({data:[]})
  ]);
  const logs=logsR.data||[]; const hist=histR.data||[];
  const logMap={}; logs.forEach(l=>{logMap[l.exercise_name+'#'+l.set_index]=l;});
  function lastFor(name){const rows=hist.filter(h=>h.exercise_name===name);if(!rows.length)return null;const sid=rows[0].session_id;return rows.filter(h=>h.session_id===sid).slice().reverse();}

  const totalSets=exs.reduce((a,e)=>a+(e.target_sets||1),0);
  const doneSets=logs.filter(l=>l.done).length;
  const wkPct=totalSets?Math.round(doneSets/totalSets*100):0;
  let html='<div class="wktop"><div class="nm">'+esc(aw.name||'Workout')+'<small>Session in progress</small></div><div class="wktimer" id="sessTimer">00:00</div></div>';
  html+='<div class="wkprogwrap"><div class="pbar" id="wkprog"><i style="width:'+wkPct+'%"></i></div><div class="wkproglab"><span id="wkproglab">'+doneSets+' / '+totalSets+' sets done</span></div></div>';
  html+='<div class="restbar"><span class="rl">Rest</span>'
    +[60,90,120].map(sec=>'<button class="restpreset'+(sec===restDefault?' active':'')+'" onclick="setRest('+sec+',this)">'+sec+'s</button>').join('')
    +'<button class="restpreset" onclick="startRest(restDefault)">Start</button>'
    +'<span class="resttime" id="restTimer">--:--</span>'
  +'</div>';
  if(!exs.length){
    html+='<div class="empty">This plan has no exercises. Finish and add some in the plan editor.</div>';
  }
  html+=exs.map(e=>{
    const last=lastFor(e.name);
    const lastTxt=last&&last.length?('<b>Last time:</b> '+last.map(x=>numOrDash(x.weight)+'kg x '+(x.reps||0)).join(',  ')):'<b>Last time:</b> --';
    let rows='';
    for(let i=0;i<(e.target_sets||1);i++){
      const lg=logMap[e.name+'#'+i];
      const ph=last&&last[i]?(numOrDash(last[i].weight)):'kg';
      const phr=last&&last[i]?(last[i].reps||''):'reps';
      const done=lg&&lg.done;
      rows+='<div class="setrow'+(done?' done':'')+'" data-ex="'+esc(e.name)+'" data-idx="'+i+'"'+(lg?' data-logid="'+lg.id+'"':'')+'>'
        +'<span class="setn">'+(i+1)+'</span>'
        +'<input class="w" inputmode="decimal" placeholder="'+ph+'" value="'+(lg&&lg.weight!=null?lg.weight:'')+'"><span class="ulab">kg</span>'
        +'<span class="xsep">x</span>'
        +'<input class="r" inputmode="numeric" placeholder="'+phr+'" value="'+(lg&&lg.reps!=null?lg.reps:'')+'"><span class="ulab">reps</span>'
        +'<button class="setdone" onclick="logSet(this)">'+svg(I.check)+'</button>'
      +'</div>';
    }
    return '<div class="exblock"><h3>'+esc(e.name)+'</h3><div class="exlast">'+lastTxt+'</div>'+rows+'</div>';
  }).join('');
  html+='<div class="wkbtns"><button class="btn" style="flex:1" onclick="discardWorkout()">Discard</button><button class="btn primary" style="flex:2" onclick="finishWorkout()">'+svg(I.check,'')+' Finish workout</button></div>';
  v.innerHTML=html;
  startSessTimer();
}
function numOrDash(n){return (n==null||n==='')?'--':n;}
function startSessTimer(){
  if(sessTick)clearInterval(sessTick);
  const upd=()=>{const e=el('sessTimer');if(e&&state.activeWorkout)e.textContent=fmtDur((Date.now()-state.activeWorkout.startedAt)/1000);};
  upd();sessTick=setInterval(upd,1000);
}
function setRest(sec,btn){restDefault=sec;document.querySelectorAll('.restpreset').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');}
function startRest(sec){
  if(restTick)clearInterval(restTick);
  let left=sec;const e=el('restTimer');if(e){e.textContent=fmtDur(left);e.classList.add('run');}
  restTick=setInterval(()=>{left--;const e2=el('restTimer');if(e2)e2.textContent=left>0?fmtDur(left):'Go!';if(left<=0){clearInterval(restTick);restTick=null;if(e2)setTimeout(()=>{if(e2){e2.textContent='--:--';e2.classList.remove('run');}},2000);}},1000);
}
function updateWkProg(){
  const rows=document.querySelectorAll('.setrow'), done=document.querySelectorAll('.setrow.done');
  const bar=el('wkprog'); const lab=el('wkproglab');
  if(bar){const i=bar.querySelector('i'); if(i)i.style.width=(rows.length?Math.round(done.length/rows.length*100):0)+'%';}
  if(lab) lab.textContent=done.length+' / '+rows.length+' sets done';
}
async function logSet(btn){
  const row=btn.closest('.setrow');
  const ex=row.dataset.ex, idx=parseInt(row.dataset.idx);
  const w=row.querySelector('.w').value===''?null:parseFloat(row.querySelector('.w').value);
  const r=row.querySelector('.r').value===''?null:parseInt(row.querySelector('.r').value);
  const nowDone=!row.classList.contains('done');
  row.classList.toggle('done',nowDone);
  updateWkProg();
  if(row.dataset.logid){
    await sb.from('dc_set_logs').update({weight:w,reps:r,done:nowDone}).eq('id',row.dataset.logid);
  } else {
    const {data}=await sb.from('dc_set_logs').insert({session_id:state.activeWorkout.id,exercise_name:ex,set_index:idx,weight:w,reps:r,done:nowDone,owner:state.account}).select().single();
    if(data)row.dataset.logid=data.id;
  }
  if(nowDone)startRest(restDefault);
}
async function finishWorkout(){
  const aw=state.activeWorkout;
  const dur=Math.round((Date.now()-aw.startedAt)/1000);
  await sb.from('dc_workout_sessions').update({ended_at:new Date().toISOString(),duration_sec:dur,completed:true}).eq('id',aw.id);
  // auto-tick the matching workout to-do for that day
  if(aw.templateId&&aw.date){
    await sb.from('dc_tasks').update({status:'done',completed_at:new Date().toISOString()}).eq('scheduled_date',aw.date).eq('template_id',aw.templateId).neq('status','skipped');
  }
  clearWorkoutTimers();localStorage.removeItem('dc_active_session');state.activeWorkout=null;
  toast('Workout complete -- '+fmtDur(dur));navigate('workouts');
}
async function discardWorkout(){
  if(!confirm('Discard this workout? Logged sets will be deleted.'))return;
  const id=state.activeWorkout.id;
  await sb.from('dc_workout_sessions').delete().eq('id',id);
  clearWorkoutTimers();localStorage.removeItem('dc_active_session');state.activeWorkout=null;navigate('workouts');
}
async function askCoach(scope,btn){
  const out=el('coachOut');if(!out)return;
  out.classList.remove('hide');out.classList.add('thinking');out.textContent='Coach is reviewing your data...';
  const btns=[...document.querySelectorAll('.coachbtns button')];btns.forEach(b=>b.disabled=true);
  try{
    const {data,error}=await sb.functions.invoke('coach',{body:{scope,owner:state.account}});
    out.classList.remove('thinking');
    if(error){out.textContent='Could not reach the coach: '+(error.message||error)+'\nIf you just set the API key, give it a few seconds and retry.';}
    else{out.textContent=(data&&data.tips)?data.tips:'No response. Try again.';}
  }catch(e){out.classList.remove('thinking');out.textContent='Error: '+e;}
  btns.forEach(b=>b.disabled=false);
}

// Read-only Food tracker: mirrors data synced from the nutrition tracker connector.
async function renderFood(v){
  const date=state.date;const s=state.settings;
  const past=addDays(date,-29);
  const [mealsR,histR]=await Promise.all([
    sb.from('dc_nutrition_meals').select('*').eq('meal_date',date).order('at_time',{nullsFirst:true}).order('synced_at'),
    sb.from('dc_nutrition_meals').select('meal_date,calories,protein,carbs,fat').gte('meal_date',past).lte('meal_date',date)
  ]);
  const meals=mealsR.data||[];const hist=histR.data||[];
  const sum=k=>meals.reduce((a,b)=>a+(Number(b[k])||0),0);
  const cal=sum('calories'),pro=sum('protein'),carb=sum('carbs'),fat=sum('fat');
  const calGoal=Number(s.cal_target)||2200,proGoal=Number(s.protein_target)||160,carbGoal=Number(s.carbs_target)||220,fatGoal=Number(s.fat_target)||70;
  function bar(lab,val,tgt,unit){const pct=tgt?Math.min(100,Math.round(val/tgt*100)):0;const over=tgt&&val>tgt*1.05;
    return '<div class="macro"><div class="lab"><span>'+lab+'</span><span>'+Math.round(val)+' / '+Math.round(tgt)+unit+'</span></div><div class="prog"><i class="'+(over?'over':'')+'" style="width:'+pct+'%"></i></div></div>';}
  // Group meals into breakfast / lunch / dinner / snack sections (MyFitnessPal-style)
  const MT=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snack']];
  const groups={};meals.forEach(m=>{const k=(m.meal_type||'snack').toLowerCase();(groups[k]=groups[k]||[]).push(m);});
  function mrow(x){return '<div class="tbox"><div class="rt"><div class="t">'+esc(x.name||'Meal')+'</div><div class="m">'
      +(x.at_time?'<span>'+esc(x.at_time.slice(0,5))+'</span>':'')
      +'<span>'+Math.round(Number(x.calories)||0)+' kcal</span>'
      +'<span>P'+Math.round(Number(x.protein)||0)+' C'+Math.round(Number(x.carbs)||0)+' F'+Math.round(Number(x.fat)||0)+'</span>'
    +'</div></div>'
    +'<div class="row-acts" style="opacity:1"><button class="btn ghost sm" title="Edit" onclick="openMealModal(\''+x.id+'\')">'+svg(I.pencil,'')+'</button>'
    +'<button class="btn ghost sm" title="Delete" onclick="delMeal(\''+x.id+'\')">'+svg(I.trash,'')+'</button></div>'
    +'</div>';}
  function msection(key,label){
    const items=groups[key]||[];
    const kc=items.reduce((a,b)=>a+(Number(b.calories)||0),0);
    const p=items.reduce((a,b)=>a+(Number(b.protein)||0),0);
    const c=items.reduce((a,b)=>a+(Number(b.carbs)||0),0);
    const f=items.reduce((a,b)=>a+(Number(b.fat)||0),0);
    return '<div class="msec">'
      +'<div class="msec-h"><span class="msec-t">'+label+'</span>'
        +'<span class="msec-k">'+Math.round(kc)+' kcal'+(items.length?' &middot; P'+Math.round(p)+' C'+Math.round(c)+' F'+Math.round(f):'')+'</span>'
        +(items.length?'<button class="btn ghost sm msec-add" title="Save '+label+' as a meal" onclick="saveMealPreset(\''+label+'\')">'+svg(I.save,'')+'</button>':'')
        +'<button class="btn ghost sm msec-add" title="Add to '+label+'" onclick="addMealTo(\''+label+'\')">'+svg(I.plus,'')+'</button>'
      +'</div>'
      +(items.length?items.map(mrow).join(''):'<div class="msec-empty">Nothing logged yet</div>')
    +'</div>';
  }
  const mealList=MT.map(t=>msection(t[0],t[1])).join('');
  // trends: aggregate calories per day over the window
  const byDay={};hist.forEach(r=>{const d=r.meal_date;if(!byDay[d])byDay[d]={cal:0,pro:0};byDay[d].cal+=Number(r.calories)||0;byDay[d].pro+=Number(r.protein)||0;});
  const days=Object.keys(byDay).sort();
  const avg=(n)=>{const ds=days.filter(d=>d>addDays(date,-n));if(!ds.length)return null;return Math.round(ds.reduce((a,d)=>a+byDay[d].cal,0)/ds.length);};
  const avg7=avg(7),avg30=avg(30);
  const proAvg7=(()=>{const ds=days.filter(d=>d>addDays(date,-7));if(!ds.length)return null;return Math.round(ds.reduce((a,d)=>a+byDay[d].pro,0)/ds.length);})();
  // logging streak ending today (consecutive days with >=1 meal up to selected date)
  let streak=0;for(let i=0,d=date;i<60;i++,d=addDays(d,-1)){if(byDay[d])streak++;else break;}
  const loggedDays=days.length;
  const spark=days.slice(-14).map(d=>{const h=Math.max(4,Math.min(38,Math.round((byDay[d].cal/(calGoal||2200))*30)));const hit=Math.abs(byDay[d].cal-calGoal)<=calGoal*0.1;return '<div class="sparkcol" title="'+shortDate(d)+': '+Math.round(byDay[d].cal)+' kcal"><i class="'+(hit?'hit':'')+'" style="height:'+h+'px"></i></div>';}).join('');
  v.innerHTML='<div class="food-wrap">'
    +'<div class="card"><div class="card-h">'+svg(I.target,'ic')+'<h2>'+(isToday(date)?'Today':shortDate(date))+' vs goals</h2>'
      +'<button class="btn ghost sm" style="margin-left:auto" title="Edit goals" onclick="openGoalsModal()">'+svg(I.pencil,'')+' Goals</button></div>'
      +'<div class="card-b" style="padding:16px">'
      +'<div class="stat" style="padding:0 0 10px"><div class="n">'+Math.round(cal)+'</div><div class="l">of '+Math.round(calGoal)+' kcal &middot; '+Math.max(0,Math.round(calGoal-cal))+' left</div></div>'
      +bar('Calories',cal,calGoal,'')+bar('Protein',pro,proGoal,'g')+bar('Carbs',carb,carbGoal,'g')+bar('Fat',fat,fatGoal,'g')
    +'</div></div>'
    +'<div class="food-main">'
    +'<div class="card"><div class="card-h">'+svg(I.food,'ic')+'<h2>Meals</h2><span class="count">'+meals.length+'</span></div>'
      +'<div class="card-b">'
      +'<div class="food-actions">'
        +'<button class="btn primary sm" onclick="openScanModal()">'+svg(I.scan,'')+' Scan barcode</button>'
        +'<button class="btn sm" onclick="openAiMealModal(\'photo\')">'+svg(I.cam,'')+' Snap meal</button>'
        +'<button class="btn sm" onclick="openAiMealModal(\'text\')">'+svg(I.spark,'')+' Describe</button>'
        +'<button class="btn sm" onclick="openMealModal()">'+svg(I.plus,'')+' Manual</button>'
        +'<button class="btn sm" onclick="openPresetPicker()">'+svg(I.save,'')+' Saved meals</button>'
      +'</div>'
      +mealList+'</div></div>'
    +'<div class="card"><div class="card-h">'+svg(I.dash,'ic')+'<h2>Trends &amp; history</h2><span class="count">last 30d</span></div><div class="card-b" style="padding:16px">'
      +'<div class="grid cols-3" style="gap:0">'
        +'<div class="stat"><div class="n">'+(avg7!=null?avg7:'--')+'</div><div class="l">Avg kcal / 7d</div></div>'
        +'<div class="stat"><div class="n">'+(avg30!=null?avg30:'--')+'</div><div class="l">Avg kcal / 30d</div></div>'
        +'<div class="stat"><div class="n">'+(proAvg7!=null?proAvg7+'g':'--')+'</div><div class="l">Avg protein / 7d</div></div>'
      +'</div>'
      +'<div class="grid cols-3" style="gap:0;margin-top:4px">'
        +'<div class="stat"><div class="n">'+streak+'</div><div class="l">Day logging streak</div></div>'
        +'<div class="stat"><div class="n">'+loggedDays+'</div><div class="l">Days logged / 30</div></div>'
        +'<div class="stat"><div class="n">'+days.filter(d=>Math.abs(byDay[d].cal-calGoal)<=calGoal*0.1).length+'</div><div class="l">Days on goal</div></div>'
      +'</div>'
      +(days.length?'<div class="section-title">Last 14 days (calories)</div><div class="spark">'+spark+'</div>':'')
    +'</div></div></div></div>';
}
let _mealPer100=null;
async function openMealModal(id,prefill){
  let x={name:'',meal_type:'Breakfast',at_time:'',calories:'',protein:'',carbs:'',fat:''};
  _mealPer100=null;let grams=null;
  if(id){const {data}=await sb.from('dc_nutrition_meals').select('*').eq('id',id).single();if(data)x=data;}
  else if(prefill){
    if(prefill._per100){

function normOFF(p,code){
  const n=p.nutriments||{};
  const num=v=>{const x=typeof v==='string'?parseFloat(v):v;return (typeof x==='number'&&isFinite(x))?Math.round(x*10)/10:null;};
  // per-100g is the always-present basis we scale from
  const per100={calories:num(n['energy-kcal_100g']),protein:num(n['proteins_100g']),carbs:num(n['carbohydrates_100g']),fat:num(n['fat_100g'])};
  // sensible default portion: the product's serving size in grams if declared, else 100g
  let servingG=null;const m=/([\d.]+)\s*g/i.exec(p.serving_size||'');if(m)servingG=Math.round(parseFloat(m[1]));
  return {name:(p.product_name||'').trim()||('Product '+code),per100:per100,servingGrams:servingG};
}
async function lookupBarcode(code){
  toast('Looking up '+code+'...');
  let food=null;
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,serving_size,nutriments');
    if(r.ok){const b=await r.json();if(b&&b.status!==0&&b.product)food=normOFF(b.product,code);}
  }catch(_){/* offline/CORS -> manual fallback */}
  const p100=food&&food.per100;
  const hasMacros=p100&&(p100.calories!=null||p100.protein!=null||p100.carbs!=null||p100.fat!=null);
  if(hasMacros){
    const g=food.servingGrams||100;
    openMealModal(null,{name:food.name,meal_type:mealTypeNow(),_per100:p100,_grams:g});
    toast('Found: '+food.name+' -- set the grams you ate');
  }else{
    openMealModal(null,{name:(food&&food.name)||('Product '+code),meal_type:mealTypeNow()});
    toast('Not in Open Food Facts -- enter the macros manually');
  }
}

function aiPhotoPicked(input){
  const f=input.files&&input.files[0];if(!f)return;
  const nm=el('aiPhotoName');if(nm)nm.textContent='Processing photo...';
  const r=new FileReader();
  r.onload=function(){
    const img=new Image();
    img.onload=function(){
      // downscale to max 1024px longest edge, re-encode JPEG to keep payload small
      const max=1024;let w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      _aiPhoto=c.toDataURL('image/jpeg',0.8);
      if(nm)nm.textContent=f.name;
      const pv=el('aiPhotoPrev');if(pv)pv.innerHTML='<img class="aiprev" src="'+_aiPhoto+'">';
    };
    img.onerror=function(){_aiPhoto=r.result;if(nm)nm.textContent=f.name;};
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

async function persistRoadmapMove(id,col,targetCol){
  let fields;

  else fields={priority:col,scheduled_date:todayStr(),status:'pending',completed_at:null};
  const ids=targetCol?[...targetCol.querySelectorAll('.rcards .rcard')].map(c=>c.dataset.id):[id];
  const updates=ids.map((cid,i)=>{

// Notion-style drag: the card lifts and follows the pointer, a live placeholder
// shows where it will land, and the drop is applied to the DOM instantly then
// saved in the background (no full re-render / jump).
function initRoadmapDnD(){
  const board=el('rboard');if(!board||board._wired)return;board._wired=true;
  let drag=null;
  function colUnder(x,y){const g=drag&&drag.ghost;if(g)g.style.display='none';const e=document.elementFromPoint(x,y);if(g)g.style.display='';return e?e.closest('.rcol'):null;}
  function placeInto(col,y){
    const wrap=col.querySelector('.rcards');if(!wrap)return;
    const cards=[...wrap.querySelectorAll('.rcard')].filter(c=>c!==drag.card);
    let before=null;
    for(const c of cards){const r=c.getBoundingClientRect();if(y<r.top+r.height/2){before=c;break;}}
    if(before)wrap.insertBefore(drag.ph,before);else wrap.appendChild(drag.ph);
  }
  board.addEventListener('pointerdown',e=>{
    const c=e.target.closest('.rcard');if(!c)return;if(e.target.closest('.rdel'))return;
    const r=c.getBoundingClientRect();
    drag={card:c,id:c.dataset.id,offX:e.clientX-r.left,offY:e.clientY-r.top,w:r.width,h:r.height,sx:e.clientX,sy:e.clientY,active:false};
    try{board.setPointerCapture(e.pointerId);}catch(_){}
  });
  board.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(!drag.active){
      if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<6)return;
      drag.active=true;
      const g=drag.card.cloneNode(true);g.classList.add('rghost');g.style.width=drag.w+'px';document.body.appendChild(g);drag.ghost=g;
      const ph=document.createElement('div');ph.className='rph';ph.style.height=drag.h+'px';drag.ph=ph;
      drag.card.parentNode.insertBefore(ph,drag.card);
      drag.card.style.display='none';
    }
    drag.ghost.style.left=(e.clientX-drag.offX)+'px';
    drag.ghost.style.top=(e.clientY-drag.offY)+'px';
    const col=colUnder(e.clientX,e.clientY);
    [...board.querySelectorAll('.rcol')].forEach(x=>x.classList.toggle('dragover',x===col));
    if(col)placeInto(col,e.clientY);
    e.preventDefault();
  });
  async function end(e){
    if(!drag)return;const d=drag;drag=null;
    try{board.releasePointerCapture(e.pointerId);}catch(_){}
    [...board.querySelectorAll('.rcol')].forEach(x=>x.classList.remove('dragover'));
    if(!d.active)return;
    if(d.ghost)d.ghost.remove();
    const targetCol=d.ph?d.ph.closest('.rcol'):null;
    d.card.style.display='';
    if(d.ph){d.ph.parentNode.insertBefore(d.card,d.ph);d.ph.remove();}
    const colName=targetCol?targetCol.dataset.col:'roadmap';
    refreshRoadmapCounts();
    await persistRoadmapMove(d.id,colName,targetCol);
  }
  board.addEventListener('pointerup',end);
  board.addEventListener('pointercancel',end);
}

// Idempotent daily task generation for BOTH accounts (next 14 days). Unique
// auto_key (account|date|type) + a localStorage horizon prevent duplicates and
// stop deleted tasks from being resurrected.
async function ensureDailyTasks(){
  const today=todayStr(), horizon=addDays(today,14);
  let from=today;
  const last=localStorage.getItem('dc_dailytasks_through');
  if(last && last>=today) from=addDays(last,1);
  if(from>horizon) return;
  const yrows=[], lrows=[];
  for(let ds=from; ds<=horizon; ds=addDays(ds,1)){
    const d=dow(ds);
    for(const s of (YAS_ROUTINE[d]||[])) yrows.push({owner:'yasmin',title:s[1],category:s[2],due_date:ds,source:'auto-schedule',auto_key:'yasmin|'+ds+'|'+s[0]});
    for(const s of (LEWIS_ROUTINE[d]||[])) lrows.push({title:s[1],category:s[2],scheduled_date:ds,source:'auto-schedule',auto_key:'lewis|'+ds+'|'+s[0]});
  }
  if(yrows.length) await sb.from('dc_todos').upsert(yrows,{onConflict:'auto_key',ignoreDuplicates:true});
  if(lrows.length) await sb.from('dc_tasks').upsert(lrows,{onConflict:'auto_key',ignoreDuplicates:true});
  localStorage.setItem('dc_dailytasks_through',horizon);
}

async function saveTodo(id){
  const t=el('tdTitle').value.trim();if(!t){toast('Add a task');return;}
  const row={title:t,due_date:el('tdDate').value||todayStr(),task_time:el('tdTime').value||null,category:el('tdCat').value,note:el('tdNote').value||null};
  if(id){await sb.from('dc_todos').update(row).eq('id',id);}
  else{row.owner=state.account;row.source='manual';row.sort_order=Date.now()%100000;await sb.from('dc_todos').insert(row);}
  closeModal();navigate('todo');
}
async function toggleTodo(node,id,done){
  const nowDone=!(done===true||done==='true');
  const box=node.closest('.tbox');node.classList.toggle('done',nowDone);box.classList.toggle('done',nowDone);
  const rt=box.querySelector('.rt');if(rt)rt.classList.toggle('done',nowDone);
  node.setAttribute('onclick',"toggleTodo(this,'"+id+"',"+(nowDone?'true':'false')+")");
  updateCount('card-todo');
  await sb.from('dc_todos').update({done:nowDone}).eq('id',id);
}
async function delTodo(id){await sb.from('dc_todos').delete().eq('id',id);closeModal();navigate('todo');}

// read-only: what the Lewis account needs to do today (missions + daily tasks)
async function lewisNeedsCard(){
  const today=todayStr();
  const [ms,ts]=await Promise.all([
    sb.from('dc_missions').select('title,priority,status').eq('scheduled_date',today).neq('status','done').order('priority'),
    sb.from('dc_tasks').select('title,category,status').eq('scheduled_date',today).neq('status','skipped').neq('status','done').order('sort_order')
  ]);
  const missions=ms.data||[], tasks=ts.data||[];
  let body='';
  if(missions.length) body+='<div class="section-title">Missions (Signal / Noise)</div>'+missions.map(m=>'<div class="tbox" style="opacity:.92"><div class="rt"><div class="t">'+esc(m.title)+'</div></div><span class="tag '+(m.priority==='signal'?'find_creators':'admin')+'">'+(m.priority==='signal'?'Signal':'Noise')+'</span></div>').join('');
  if(tasks.length) body+='<div class="section-title">Daily tasks</div>'+tasks.map(t=>'<div class="tbox" style="opacity:.92"><div class="rt"><div class="t">'+esc(t.title)+'</div></div><span class="tag '+t.category+'">'+titleCase(t.category)+'</span></div>').join('');
  if(!body) body='<div class="empty">Nothing outstanding on Lewis Account right now.</div>';
  return '<div class="card"><div class="card-h">'+svg(I.target,'ic')+'<h2>What Lewis needs to do today</h2></div><div class="card-b">'+body+'</div></div>';
}

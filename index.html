<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f7f7f5; --panel:#fbfbfa; --card:#ffffff; --ink:#37352f; --muted:#9b9a97;
  --line:#ececeb; --line2:#e3e3e1; --accent:#5b6cff; --accent-soft:#eef0ff;
  --signal:#e8a13a; --signal-soft:#fdf3e3; --noise:#b6b5b1; --ok:#3aa675; --ok-soft:#e7f6ee;
  --shadow:0 1px 2px rgba(15,15,15,.04),0 4px 16px rgba(15,15,15,.05);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::placeholder{color:#bdbcb8}

/* ---------- Layout ---------- */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b6cff,#8a6cff);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 30px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;
  color:#5f5e5a;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;transition:.12s}
.nav button:hover{background:#f0f0ef}
.nav button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.nav button svg{width:17px;height:17px;flex:0 0 17px;opacity:.7}
.nav .label{font-size:11px;font-weight:600;color:#b6b5b1;text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 4px}
.side-foot{margin-top:auto;padding:10px 8px;font-size:12px;color:var(--muted)}
.side-foot button{background:none;border:none;color:var(--muted);font-size:12px;padding:0;text-decoration:underline}

.main{flex:1;overflow-y:auto;padding:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:13px;color:var(--muted)}
.daynav{margin-left:auto;display:flex;align-items:center;gap:6px}
.daynav button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 10px;color:var(--ink);font-weight:500}
.daynav button:hover{background:#f4f4f3}
.daynav .today-pill{font-weight:600}
.wrap{padding:24px 32px 64px;max-width:1180px;margin:0 auto}

/* ---------- Generic ---------- */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.cols-2,.cols-3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:14px;font-weight:600}
.card-h .ic{width:18px;height:18px;color:var(--accent)}
.card-h .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.card-b{padding:8px 10px 12px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 4px}

.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-weight:600;color:var(--ink);font-size:13px;transition:.12s}
.btn:hover{background:#f4f4f3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:#f0f0ef;color:var(--ink)}

.row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px}
.row:hover{background:#f7f7f6}
.row:hover .row-acts{opacity:1}
.row-acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s}
.chk{width:18px;height:18px;flex:0 0 18px;border:1.6px solid #cfcfcc;border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:.12s}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk svg{width:12px;height:12px;opacity:0}
.chk.done svg{opacity:1}
.rt{flex:1;min-width:0}
.rt .t{font-weight:500}
.rt.done .t{text-decoration:line-through;color:var(--muted)}
.rt .m{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:1px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#f0f0ef;color:#6f6e6a}
.tag.food{background:#eef7f0;color:#3a8c5e}.tag.supplement{background:#f0f0ff;color:#6a5bd6}
.tag.workout{background:#fdeee6;color:#c87a3a}.tag.relationship{background:#fdeef4;color:#c75b91}
.tag.find_creators{background:#eef0ff;color:#5b6cff}.tag.product_testing{background:#eef7f0;color:#3a8c5e}
.tag.advertisements{background:#fdf3e3;color:#c08a2a}.tag.admin{background:#f0f0ef;color:#7a7975}

.quick{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);margin-top:4px}
.quick input,.quick select{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff}
.quick input.grow{flex:1}
.empty{text-align:center;color:var(--muted);padding:22px 12px;font-size:13px}

/* signal/noise */
.sn-head{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-top:4px}
.sn-head .dot{width:8px;height:8px;border-radius:50%}
.dot.s{background:var(--signal)}.dot.n{background:var(--noise)}
.sn-head b{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.sn-head .hint{font-size:11px;color:var(--muted);font-weight:500}
.row.noise{opacity:.78}
.locked-note{font-size:11px;color:var(--signal);background:var(--signal-soft);padding:6px 10px;border-radius:8px;margin:4px 8px}

/* nudges */
.nudges{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.nudge{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:11px 14px;box-shadow:var(--shadow)}
.nudge.warn{border-left-color:var(--signal)}
.nudge svg{width:18px;height:18px;flex:0 0 18px}
.nudge .x{margin-left:auto}

/* suggestions */
.sugg{background:linear-gradient(135deg,#f5f6ff,#fbf7ff);border:1px solid #e6e6fb;border-radius:var(--radius);padding:14px 16px}
.sugg h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sugg h3 svg{width:16px;height:16px;color:var(--accent)}
.sugg .item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed #e1e1f5}
.sugg .item:first-of-type{border-top:none}
.sugg .item .txt{flex:1}.sugg .item .txt small{color:var(--muted)}
.outsource{font-size:12px;color:#b5532a;background:#fcefe8;border:1px solid #f3d7c7;border-radius:8px;padding:8px 11px;margin-top:8px}

/* goals + vision */
.goal-row{display:flex;align-items:center;gap:10px;padding:8px}
.vision-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:8px}
.vtile{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#f0f0ef;border:1px solid var(--line)}
.vtile img{width:100%;height:100%;object-fit:cover;display:block}
.vtile .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));
  color:#fff;font-size:11px;font-weight:600;padding:14px 8px 6px}
.vtile .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:none;color:#fff;border-radius:6px;width:24px;height:24px;opacity:0;transition:.12s}
.vtile:hover .del{opacity:1}
.vadd{display:flex;align-items:center;justify-content:center;border:1.5px dashed #cfcfcc;color:var(--muted);cursor:pointer;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.vadd:hover{border-color:var(--accent);color:var(--accent)}

/* free-form vision board */
.vboard{position:relative;height:660px;background:#fbfbfa;overflow:hidden;border-radius:0 0 var(--radius) var(--radius);
  background-image:radial-gradient(#e7e7e5 1px,transparent 1px);background-size:24px 24px;touch-action:none}
.vboard-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none;text-align:center;padding:0 20px}
.vitem{position:absolute;cursor:grab;border-radius:10px;box-shadow:var(--shadow);touch-action:none;user-select:none}
.vitem:active{cursor:grabbing}
.vitem.img{overflow:hidden;background:#eee}
.vitem.img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;border-radius:10px}
.vitem.text{box-shadow:none;background:transparent;border-radius:6px}
.vtext{width:100%;height:100%;outline:none;font-weight:700;font-size:22px;line-height:1.25;color:var(--ink);
  padding:6px 8px;overflow:hidden;cursor:grab;white-space:pre-wrap;word-break:break-word}
.vtext[contenteditable="true"]{cursor:text;background:rgba(255,255,255,.85);box-shadow:0 0 0 2px var(--accent);border-radius:6px}
.vitem .vdel{position:absolute;top:5px;right:5px;width:24px;height:24px;border:none;border-radius:6px;
  background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:.12s;z-index:2}
.vitem:hover .vdel{opacity:1}
.vitem .vrz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 48%,var(--accent) 48%);border-radius:0 0 10px 0;opacity:0;transition:.12s;z-index:2}
.vitem:hover .vrz{opacity:.95}
.vtext:empty:before{content:"Type your vision...";color:var(--muted);font-weight:600}
.vitem.loading{display:flex;align-items:center;justify-content:center;background:#eef0ff;border:1px dashed var(--accent)}
.vload{color:var(--accent);font-size:12px;font-weight:600}
.ndismiss{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center}
.ndismiss:hover{background:#f0f0ef;color:var(--ink)}

/* progress */
.prog{height:8px;border-radius:6px;background:#eee;overflow:hidden}
.prog > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.macro{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.macro .lab{display:flex;justify-content:space-between;font-size:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:16px}
.stat .n{font-size:28px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--muted);font-weight:500}

/* time blocking */
.cal{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.cal .hour{display:flex;border-top:1px solid var(--line);height:54px}
.cal .hour:first-child{border-top:none}
.cal .hlabel{flex:0 0 64px;font-size:11px;color:var(--muted);padding:4px 8px;border-right:1px solid var(--line);text-align:right}
.cal .htrack{flex:1;position:relative}
.cal .layer{position:absolute;inset:0}
.block{position:absolute;left:6px;right:6px;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:#fff;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.block small{display:block;font-weight:500;opacity:.9;font-size:11px}
.b-work{background:#5b6cff}.b-workout{background:#c87a3a}.b-sleep{background:#7a7d99}
.b-meal{background:#3a8c5e}.b-personal{background:#c75b91}.b-focus{background:#8a6cff}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,15,15,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:#6f6e6a}
.field input,.field select,.field textarea{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;width:100%}
.field .two{display:flex;gap:10px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* gate */
.gate{position:fixed;inset:0;background:radial-gradient(120% 120% at 50% 0,#eef0ff, #f7f7f5);display:flex;align-items:center;justify-content:center;z-index:200}
.gate .box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.12);padding:34px 30px;width:340px;text-align:center}
.gate .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#5b6cff,#8a6cff);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff}
.gate h2{font-size:18px;margin-bottom:4px}.gate p{color:var(--muted);font-size:13px;margin-bottom:18px}
.gate input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 13px;text-align:center;letter-spacing:2px;margin-bottom:12px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#37352f;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:300}
#toast.show{opacity:1}
.hide{display:none!important}

/* ---- dashboard layout ---- */
.dash-top{display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr);gap:18px;align-items:start}
.dash-bottom{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
@media(max-width:900px){.dash-top{grid-template-columns:1fr}}

/* ---- reorderable dashboard grid ---- */
.dashgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.dashgrid{grid-template-columns:1fr}}
.dsection{position:relative;min-width:0;display:flex;flex-direction:column;gap:18px}
.dsection.dragging{opacity:.45}
.dsection.dragover{outline:2px dashed var(--accent);outline-offset:4px;border-radius:14px}
.dgrip{position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:6;width:40px;height:20px;
  display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line2);
  border-radius:7px;color:var(--muted);cursor:grab;opacity:0;transition:.12s;box-shadow:var(--shadow)}
.dsection:hover .dgrip{opacity:1}
.dgrip:active{cursor:grabbing}
.dgrip svg{width:16px;height:16px}

/* ---- boxed task / mission items ---- */
.tbox{display:flex;align-items:center;gap:11px;padding:12px 13px;margin:8px 6px;border:1px solid var(--line2);border-radius:11px;background:#fff;transition:.12s}
.tbox:hover{border-color:#d6d6d3;box-shadow:var(--shadow)}
.tbox:hover .row-acts{opacity:1}
.tbox.noise{background:#fafafa}
.tbox.done{background:#fbfdfb;border-color:#e3efe8}
.tbox .rt .t{font-weight:500}

/* ---- add bar (full-width button) ---- */
.addbar{display:flex;flex-direction:column;gap:8px;padding:12px 6px 4px;border-top:1px solid var(--line);margin-top:8px}
.addbar .inrow{display:flex;gap:8px}
.addbar input,.addbar select{border:1px solid var(--line2);border-radius:9px;padding:10px 12px;background:#fff;min-width:0}
.addbar input.grow,.addbar select.grow{flex:1}
.btn.full{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;font-size:14px}

/* ---- responsive splits (time / food) ---- */
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.food-wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.cal-wrap,.food-wrap{grid-template-columns:1fr}}

.daynav button{display:flex;align-items:center;justify-content:center}

/* ---- mobile ---- */
@media(max-width:760px){
  #app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .sidebar{width:100%;flex:0 0 auto;border-right:none;border-bottom:1px solid var(--line);padding:12px 12px 10px}
  .brand{padding:4px 6px 10px}
  .sidebar .nav{flex-direction:row;flex-wrap:wrap}
  .nav .label{display:none}
  .nav button{width:auto;padding:8px 12px}
  .side-foot{display:none}
  .main{overflow:visible}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:18px}
  .wrap{padding:16px 14px 56px}
  .cal .hlabel{flex:0 0 50px}
  .stat .n{font-size:24px}
  .row-acts{opacity:1}
}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="box">
    <div class="logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg></div>
    <h2>Daily Command</h2>
    <p>Enter your passcode to continue</p>
    <input id="passInput" type="password" placeholder="passcode" autofocus>
    <button class="btn primary" style="width:100%" id="unlockBtn">Unlock</button>
  </div>
</div>

<div id="app" class="hide">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg></div>
      <div><b>Daily Command</b><span id="brandSub">your day, handled</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="footDate"></div>
      <button id="lockBtn">Lock</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="sub" id="viewSub"></div>
      </div>
      <div class="daynav" id="daynav"></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

// ===================== HELPERS =====================
function todayStr(){const d=new Date();return ymd(d);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d);}
function parseDate(s){return new Date(s+'T00:00');}
function dow(s){return parseDate(s).getDay();}
function isToday(s){return s===todayStr();}
function prettyDate(s){const d=parseDate(s);return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
function shortDate(s){const d=parseDate(s);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function nowHM(){const d=new Date();return d.getHours()+d.getMinutes()/60;}
function hm(t){if(!t)return null;const p=t.split(':');return parseInt(p[0])+parseInt(p[1])/60;}
function fmtTime(t){if(!t)return '';const p=t.split(':');let h=parseInt(p[0]);const m=p[1];const ap=h>=12?'pm':'am';h=h%12||12;return h+(m!=='00'?':'+m:'')+ap;}
function el(id){return document.getElementById(id);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function titleCase(s){return (s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}

async function ensureTasksFor(date){
  const {data:routines}=await sb.from('dc_routines').select('*').eq('active',true);
  if(!routines||!routines.length) return;
  const {data:existing}=await sb.from('dc_tasks').select('routine_id').eq('scheduled_date',date);
  const have=new Set((existing||[]).map(r=>r.routine_id));
  const d=dow(date);const add=[];
  for(const r of routines){
    if(have.has(r.id))continue;
    if(isDue(r,d))add.push({routine_id:r.id,title:r.title,category:r.category,scheduled_date:date,scheduled_time:r.default_time,sort_order:r.sort_order});
  }
  if(add.length)await sb.from('dc_tasks').insert(add);
}
function isDue(r,d){
  if(r.recurrence==='daily')return true;
  if(r.recurrence==='weekdays')return d>=1&&d<=5;
  if(r.recurrence==='weekends')return d===0||d===6;
  if(r.recurrence==='weekly'||r.recurrence==='custom')return (r.weekdays||[]).includes(d);
  return false;
}

  initDashGrid();
}

function missionCard(M){
  const signals=M.filter(m=>m.priority==='signal');

  const signalsDone=signals.length&&signals.every(m=>m.status==='done');
  function mrow(m,isNoise){
    const d=m.status==='done';
    return '<div class="tbox '+(isNoise?'noise':'')+' '+(d?'done':'')+'">'
      +'<div class="chk '+(d?'done':'')+'" onclick="toggleMission(this,\''+m.id+'\',\''+m.status+'\')">'+svg(I.check)+'</div>'
      +'<div class="rt '+(d?'done':'')+'"><div class="t">'+esc(m.title)+'</div></div>'
      +'<div class="row-acts">'

        +'<button class="btn ghost sm" title="Delete" onclick="deleteMission(\''+m.id+'\')">'+svg(I.trash,'')+'</button>'
      +'</div></div>';
  }
  let body='<div class="sn-head"><span class="dot s"></span><b>Signals</b><span class="hint">move the needle</span></div>';
  body += signals.length?signals.map(m=>mrow(m,false)).join(''):'<div class="empty">No signals yet. What is the one thing that matters most today?</div>';
  body += '<div class="sn-head" style="margin-top:10px"><span class="dot n"></span><b>Noise</b><span class="hint">necessary, low-impact</span></div>';
  if(noise.length && !signalsDone && signals.length) body+='<div class="locked-note">Knock out your signals first. Noise can wait.</div>';
  body += noise.length?noise.map(m=>mrow(m,true)).join(''):'<div class="empty" style="padding:10px">Nothing here.</div>';
  return '<div class="card" id="card-mission">'
    +'<div class="card-h">'+svg(I.target,'ic')+'<h2>Mission &middot; Signal vs Noise</h2></div>'
    +'<div class="card-b">'+body
      +'<div class="addbar">'
        +'<input class="grow" id="nmTitle" placeholder="Add a work task...">'
        +'<div class="inrow">'
          +'<select id="nmPri" class="grow"><option value="signal">Signal -- high impact</option><option value="noise">Noise -- low impact</option></select>'
        +'</div>'
        +'<button class="btn primary full" onclick="addMission()">'+svg(I.plus,'')+' Let&#39;s Go</button>'
      +'</div>'
    +'</div></div>';
}

// ---- Suggestions (heuristic) ----
async function missionSuggestions(todayM){
  const since=addDays(todayStr(),-21);
  const {data}=await sb.from('dc_missions').select('category,title,scheduled_date').gte('scheduled_date',since);
  const rows=data||[];
  if(rows.length<3) return null;
  const todayTitles=new Set(todayM.map(m=>m.title.toLowerCase()));
  const catCount={},titleCount={};
  rows.forEach(r=>{catCount[r.category]=(catCount[r.category]||0)+1;
    const k=r.title.toLowerCase().trim();titleCount[k]=(titleCount[k]||0)+1;});
  const topCats=Object.entries(catCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const repeats=Object.entries(titleCount).filter(([k,c])=>c>=4).sort((a,b)=>b[1]-a[1]);
  const suggCats=topCats.filter(([c])=>!todayM.some(m=>m.category===c)).slice(0,2);
  return {suggCats, repeats:repeats.slice(0,2), total:rows.length};
}
function suggCard(s){
  let items = s.suggCats.length? s.suggCats.map(([c,n])=>
    '<div class="item"><div class="txt">'+titleCase(c)+' <small>&middot; done '+n+'x in last 3 weeks</small></div>'
    +'<button class="btn sm primary" onclick="quickAddMission(\''+c+'\')">'+svg(I.plus,'')+' Add</button></div>').join('')
    : '<div class="item"><div class="txt"><small>You are covering your usual categories today. Nice.</small></div></div>';
  let out = s.repeats.length? '<div class="outsource">'+svg(I.spark,'')+' <b>Outsourcing tip:</b> you have repeated &quot;'+esc(titleCase(s.repeats[0][0]))+'&quot; '+s.repeats[0][1]+' times recently. This looks delegable -- consider handing it off so you can stay on signals.</div>':'';
  return '<div class="sugg"><h3>'+svg(I.spark)+'Morning suggestions</h3>'
    +'<div style="font-size:12px;color:#7a7975;margin-bottom:6px">Based on '+s.total+' tasks over the last 3 weeks.</div>'
    +items+out+'</div>';
}

// ---- dashboard section ordering (drag to reorder, persisted per device) ----
const DASH_KEYS=['month','todo','mission','vision'];
function getDashOrder(){try{const a=JSON.parse(localStorage.getItem('dc_dash_order')||'[]').filter(k=>DASH_KEYS.includes(k));DASH_KEYS.forEach(k=>{if(!a.includes(k))a.push(k);});return a;}catch(e){return DASH_KEYS.slice();}}
function saveDashOrder(a){localStorage.setItem('dc_dash_order',JSON.stringify(a));}
function initDashGrid(){
  const grid=el('dashgrid');if(!grid||grid._wired)return;grid._wired=true;
  let dragKey=null;
  grid.addEventListener('mousedown',e=>{const g=e.target.closest('.dgrip');if(!g)return;const s=g.closest('.dsection');if(s)s.setAttribute('draggable','true');});
  grid.addEventListener('mouseup',()=>{[...grid.children].forEach(c=>c.setAttribute('draggable','false'));});
  grid.addEventListener('dragstart',e=>{const s=e.target.closest('.dsection');if(!s||s.getAttribute('draggable')!=='true'){e.preventDefault();return;}dragKey=s.dataset.key;s.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragKey);}catch(_){}});
  grid.addEventListener('dragover',e=>{if(!dragKey)return;e.preventDefault();const s=e.target.closest('.dsection');[...grid.children].forEach(c=>c.classList.toggle('dragover',c===s&&c.dataset.key!==dragKey));});
  grid.addEventListener('drop',e=>{
    if(!dragKey)return;e.preventDefault();
    const target=e.target.closest('.dsection');const dragged=grid.querySelector('.dsection[data-key="'+dragKey+'"]');
    if(target&&dragged&&target!==dragged){const items=[...grid.children];
      if(items.indexOf(dragged)<items.indexOf(target))target.after(dragged);else target.before(dragged);
      saveDashOrder([...grid.children].map(c=>c.dataset.key));}
    finishDrag();
  });
  grid.addEventListener('dragend',finishDrag);
  function finishDrag(){[...grid.children].forEach(c=>{c.classList.remove('dragover','dragging');c.setAttribute('draggable','false');});dragKey=null;}
}

// ---- vision upload ----
function clearVboardEmpty(board){const e=board.querySelector('.vboard-empty');if(e)e.remove();}
async function uploadVision(input){
  const file=input.files[0];if(!file)return;
  const board=el('vboard');if(!board)return;
  clearVboardEmpty(board);
  const n=board.querySelectorAll('.vitem').length;const off=(n%6)*26;
  const x=30+off,y=30+off,w=240,h=200,z=n+1;
  // instant placeholder so it feels responsive while the upload runs
  const tmp='tmp'+Date.now();
  board.insertAdjacentHTML('beforeend','<div class="vitem img loading" data-tmp="'+tmp+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;z-index:'+z+'"><div class="vload">Uploading...</div></div>');
  input.value='';
  const path=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'');
  const up=await sb.storage.from(VBUCKET).upload(path,file,{upsert:true});
  const ph=board.querySelector('[data-tmp="'+tmp+'"]');
  if(up.error){if(ph)ph.remove();toast('Upload failed');return;}
  const {data}=sb.storage.from(VBUCKET).getPublicUrl(path);
  const ins=await sb.from('dc_vision').insert({kind:'image',image_url:data.publicUrl,x,y,w,h,z}).select().single();
  if(ins.error){if(ph)ph.remove();toast('Could not save image');return;}
  if(ph)ph.outerHTML=vitemHTML(ins.data); else board.insertAdjacentHTML('beforeend',vitemHTML(ins.data));
  toast('Image added');
}
async function addVisionText(){
  const board=el('vboard');if(!board)return;

  const ins=await sb.from('dc_vision').insert({kind:'text',content:'',x:40,y:40,w:240,h:70,z:n+1}).select().single();

}
async function delVision(id,url){
  if(!confirm('Remove this item?'))return;
  const board=el('vboard');const it=board&&board.querySelector('.vitem[data-id="'+id+'"]');if(it)it.remove();
  await sb.from('dc_vision').delete().eq('id',id);
  try{const p=(url||'').split('/'+VBUCKET+'/')[1];if(p)await sb.storage.from(VBUCKET).remove([p]);}catch(e){}
}
// ---- free-form board interactions (drag / resize / text / z-order) ----
// Delegated so dynamically-added items work without re-rendering the dashboard.
function initVisionBoard(){
  const board=el('vboard');if(!board||board._wired)return;board._wired=true;
  let drag=null;
  board.addEventListener('pointerdown',e=>{
    const item=e.target.closest('.vitem');if(!item)return;
    if(e.target.closest('.vdel'))return;
    if(e.target.isContentEditable)return; // editing text: allow caret, no drag
    const isRz=!!e.target.closest('.vrz');
    const r=item.getBoundingClientRect();
    drag={item,pid:e.pointerId,mode:isRz?'resize':'move',active:isRz,sx:e.clientX,sy:e.clientY,
      ox:parseFloat(item.style.left)||0,oy:parseFloat(item.style.top)||0,ow:r.width,oh:r.height};
  });
  board.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.active){ if(Math.abs(dx)+Math.abs(dy)<4)return; drag.active=true; bringToFront(drag.item); try{drag.item.setPointerCapture(drag.pid);}catch(_){} }
    if(drag.mode==='move'){
      drag.item.style.left=Math.max(0,drag.ox+dx)+'px';
      drag.item.style.top=Math.max(0,drag.oy+dy)+'px';
    }else{
      drag.item.style.width=Math.max(60,drag.ow+dx)+'px';
      drag.item.style.height=Math.max(40,drag.oh+dy)+'px';
    }
  });
  async function endDrag(){
    if(!drag)return;const d=drag;drag=null;
    if(!d.active)return; // a click, nothing moved
    const it=d.item;const r=it.getBoundingClientRect();
    await sb.from('dc_vision').update({x:Math.round(parseFloat(it.style.left)||0),y:Math.round(parseFloat(it.style.top)||0),
      w:Math.round(r.width),h:Math.round(r.height)}).eq('id',it.dataset.id);
  }
  board.addEventListener('pointerup',endDrag);
  board.addEventListener('pointercancel',endDrag);
  board.addEventListener('dblclick',e=>{
    const t=e.target.closest('.vtext');if(!t)return;
    t.contentEditable='true';t.focus();
    const sel=window.getSelection();sel.selectAllChildren(t);
  });
  // save as you type (debounced) so text persists even if blur doesn't fire
  let saveT=null;
  board.addEventListener('input',e=>{
    const t=e.target.closest&&e.target.closest('.vtext');if(!t)return;
    const id=t.closest('.vitem').dataset.id;const val=t.innerText;
    clearTimeout(saveT);saveT=setTimeout(async()=>{await sb.from('dc_vision').update({content:val}).eq('id',id);},500);
  });
  board.addEventListener('focusout',async e=>{
    const t=e.target.closest&&e.target.closest('.vtext');if(!t||t.contentEditable!=='true')return;
    t.contentEditable='false';
    await sb.from('dc_vision').update({content:t.innerText}).eq('id',t.closest('.vitem').dataset.id);
  });
}
async function bringToFront(item){
  const board=el('vboard');if(!board)return;
  const max=Math.max(0,...[...board.querySelectorAll('.vitem')].map(x=>parseInt(x.style.zIndex)||0));
  if((parseInt(item.style.zIndex)||0)===max)return;
  item.style.zIndex=max+1;
  await sb.from('dc_vision').update({z:max+1}).eq('id',item.dataset.id);
}

// ===================== NUDGES =====================
async function computeNudges(T,M){
  const out=[];
  if(!isToday(state.date)) return out;
  const now=nowHM();const h=new Date().getHours();
  const overdue=T.filter(t=>t.status==='pending'&&t.scheduled_time&&hm(t.scheduled_time)<now);
  if(overdue.length) out.push({warn:true,t:overdue.length+' routine'+(overdue.length>1?'s are':' is')+' past due: '+overdue.slice(0,2).map(x=>x.title).join(', ')});
  const sig=M.filter(m=>m.priority==='signal');
  if(sig.length&&sig.every(m=>m.status==='done')) out.push({warn:false,t:'All signals cleared. Strong day -- noise is fair game now.'});
  else if(sig.length&&h>=12&&!sig.some(m=>m.status==='done')) out.push({warn:true,t:'It is past noon and no signal is done yet. Protect your focus -- start the one that matters.'});
  // meals
  const {data:food}=await sb.from('dc_food').select('meal').eq('log_date',state.date);
  const meals=new Set((food||[]).map(x=>x.meal));
  if(h>=14&&!meals.has('lunch')) out.push({warn:true,t:'No lunch logged yet. Tap Food to keep your calorie tracking honest.'});
  if(h>=20&&!meals.has('dinner')) out.push({warn:true,t:'Dinner not logged. Quick add it before the day closes.'});
  // workout
  const woTask=T.find(t=>t.category==='workout'&&t.status==='pending');
  const {data:wo}=await sb.from('dc_workouts').select('id').eq('workout_date',state.date);
  if(woTask&&!(wo||[]).length&&h>=17) out.push({warn:true,t:'Workout still pending. Lock in a slot in Time-blocking so it does not slip.'});
  // upcoming block
  const {data:blocks}=await sb.from('dc_timeblocks').select('*').eq('block_date',state.date);
  const up=(blocks||[]).map(b=>({b,s:hm(b.start_time)})).filter(x=>x.s>now&&x.s-now<=0.5).sort((a,b)=>a.s-b.s)[0];
  if(up) out.push({warn:false,t:'Coming up at '+fmtTime(up.b.start_time)+': '+up.b.title});
  const dis=getDismissed();
  return out.map(n=>({warn:n.warn,t:n.t,id:hashStr(n.t)})).filter(n=>!dis.includes(n.id));
}
function nudgeHtml(n){
  return '<div class="nudge '+(n.warn?'warn':'')+'" data-id="'+n.id+'">'+svg(n.warn?I.bell:I.spark,'')
    +'<span>'+esc(n.t)+'</span>'
    +'<button class="ndismiss" title="Dismiss" onclick="dismissNudge(\''+n.id+'\')">'+svg(I.x,'')+'</button></div>';
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return 'n'+(h>>>0);}
function dismissedKey(){return 'dc_dismissed_'+state.date;}
function getDismissed(){try{return JSON.parse(localStorage.getItem(dismissedKey())||'[]');}catch(e){return [];}}
function dismissNudge(id){
  const arr=getDismissed();if(!arr.includes(id)){arr.push(id);localStorage.setItem(dismissedKey(),JSON.stringify(arr));}
  const node=document.querySelector('.nudge[data-id="'+id+'"]');
  if(node){const cont=node.parentElement;node.remove();if(cont&&!cont.querySelector('.nudge'))cont.remove();}
}

// ===================== TIME-BLOCKING =====================
async function renderTime(v){
  const date=state.date;
  const s=state.settings;
  const startH=Math.max(0,parseInt((s.wake_time||'06:00').split(':')[0]));
  const endH=Math.min(24,parseInt((s.sleep_time||'23:00').split(':')[0])+1);
  const [blocksR,missionsR]=await Promise.all([
    sb.from('dc_timeblocks').select('*').eq('block_date',date).order('start_time'),
    sb.from('dc_missions').select('*').eq('scheduled_date',date).eq('priority','signal')
  ]);
  const blocks=blocksR.data||[];
  const tip=workTimeTip(s,blocks);
  let hours='';
  for(let hh=startH;hh<endH;hh++){
    hours+='<div class="hour"><div class="hlabel">'+fmtTime(String(hh).padStart(2,'0')+':00')+'</div><div class="htrack"></div></div>';
  }
  const pxPerHour=54;
  const blockEls=blocks.map(b=>{
    const top=(hm(b.start_time)-startH)*pxPerHour;
    const height=Math.max(22,(hm(b.end_time)-hm(b.start_time))*pxPerHour-4);
    return '<div class="block b-'+b.type+'" style="top:'+top+'px;height:'+height+'px" onclick="delBlock(\''+b.id+'\')" title="Click to delete">'
      +esc(b.title)+'<small>'+fmtTime(b.start_time)+' - '+fmtTime(b.end_time)+'</small></div>';
  }).join('');
  v.innerHTML =
    '<div class="cal-wrap">'
    +'<div class="cal"><div style="position:relative">'+hours
      +'<div class="layer" style="left:64px">'+blockEls+'</div>'
    +'</div></div>'
    +'<div style="display:flex;flex-direction:column;gap:18px">'
      +'<div class="card"><div class="card-h">'+svg(I.plus,'ic')+'<h2>Add a block</h2></div><div class="card-b" style="padding:14px">'
        +'<div class="field"><input id="tbTitle" placeholder="Block title (e.g. Deep work)"></div>'
        +'<div class="field" style="margin-top:10px"><div class="two">'
          +'<input id="tbStart" type="time" value="09:00"><input id="tbEnd" type="time" value="10:30"></div></div>'
        +'<div class="field" style="margin-top:10px"><select id="tbType">'
          +'<option value="work">Work</option><option value="focus">Deep focus</option><option value="workout">Workout</option>'
          +'<option value="meal">Meal</option><option value="sleep">Sleep</option><option value="personal">Personal</option></select></div>'
        +'<button class="btn primary" style="width:100%;margin-top:12px" onclick="addBlock()">'+svg(I.plus,'')+' Add block</button>'
      +'</div></div>'
      +'<div class="sugg"><h3>'+svg(I.spark)+'Maximize work hours</h3>'+tip+'</div>'
    +'</div></div>';
}
function workTimeTip(s,blocks){
  const wake=fmtTime(s.wake_time),sleep=fmtTime(s.sleep_time);
  const woStart=s.wake_time;const woEnd=addMin(s.wake_time,60);
  return '<div style="font-size:13px;color:#555;line-height:1.6">'
    +'You are awake '+wake+' to '+sleep+'. To protect the most unbroken work time:'
    +'<div style="margin-top:8px"><b>Workout:</b> right after waking ('+fmtTime(woStart)+'-'+fmtTime(woEnd)+') -- it is done before the workday and frees your afternoon for signals.</div>'
    +'<div style="margin-top:6px"><b>Sleep:</b> aim for lights out by '+sleep+' to keep a full early block tomorrow.</div>'
    +'<div style="margin-top:6px"><b>Deep work:</b> stack your hardest signal in your first 2 work hours, before meetings and noise creep in.</div>'
    +'<button class="btn primary full" style="margin-top:12px" onclick="autoSchedule()">'+svg(I.spark,'')+' Auto-build my full day</button>'
    +'<div style="margin-top:6px;font-size:11px;color:#8a8985">Adds workout, deep work, lunch, focus, wind-down and sleep at '+sleep+'.</div>'
    +'</div>';
}
function addMin(t,m){const x=hm(t)+m/60;const h=Math.floor(x);const mm=Math.round((x-h)*60);return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
async function autoSchedule(){
  const s=state.settings;const date=state.date;
  const plan=[
    {title:'Workout',start:s.wake_time,end:addMin(s.wake_time,60),type:'workout'},
    {title:'Deep work (top signal)',start:addMin(s.wake_time,90),end:addMin(s.wake_time,210),type:'focus'},
    {title:'Lunch',start:'12:30',end:'13:15',type:'meal'},
    {title:'Focused work',start:'13:30',end:'15:30',type:'work'},
    {title:'Admin / noise',start:'15:30',end:'16:30',type:'work'},
    {title:'Wind down',start:addMin(s.sleep_time,-60),end:s.sleep_time,type:'personal'},
    {title:'Sleep',start:s.sleep_time,end:addMin(s.sleep_time,30),type:'sleep'}
  ];
  const rows=plan.map(b=>({title:b.title,block_date:date,start_time:b.start,end_time:b.end,type:b.type}));
  await sb.from('dc_timeblocks').insert(rows);
  toast('Built your full day -- tweak any block as needed');navigate('time');
}
async function addBlock(){
  const t=el('tbTitle').value.trim();if(!t){toast('Add a title');return;}
  await sb.from('dc_timeblocks').insert({title:t,block_date:state.date,start_time:el('tbStart').value,end_time:el('tbEnd').value,type:el('tbType').value});
  el('tbTitle').value='';navigate('time');
}
async function delBlock(id){await sb.from('dc_timeblocks').delete().eq('id',id);navigate('time');}

// ===================== FOOD =====================
async function renderFood(v){
  const date=state.date;const s=state.settings;
  const {data}=await sb.from('dc_food').select('*').eq('log_date',date).order('created_at');
  const F=data||[];
  const sum=k=>F.reduce((a,b)=>a+(b[k]||0),0);
  const cal=sum('calories'),pro=sum('protein'),carb=sum('carbs'),fat=sum('fat');
  function bar(lab,val,tgt,unit){const pct=tgt?Math.min(100,Math.round(val/tgt*100)):0;
    return '<div class="macro"><div class="lab"><span>'+lab+'</span><span>'+val+' / '+tgt+unit+'</span></div><div class="prog"><i style="width:'+pct+'%"></i></div></div>';}
  const meals=['breakfast','lunch','dinner','snack'];
  const mealBlocks=meals.map(m=>{
    const items=F.filter(x=>x.meal===m);
    if(!items.length)return '';
    return '<div class="section-title">'+titleCase(m)+'</div>'+items.map(x=>
      '<div class="row"><div class="rt"><div class="t">'+esc(x.name)+'</div><div class="m">'+x.calories+' kcal &middot; P'+x.protein+' C'+x.carbs+' F'+x.fat+'</div></div>'
      +'<button class="btn ghost sm" onclick="delRow(\'dc_food\',\''+x.id+'\')">'+svg(I.trash,'')+'</button></div>').join('');
  }).join('');
  v.innerHTML='<div class="food-wrap">'
    +'<div class="card"><div class="card-h">'+svg(I.target,'ic')+'<h2>Today vs goals</h2></div><div class="card-b" style="padding:16px">'
      +'<div class="stat" style="padding:0 0 10px"><div class="n">'+cal+'</div><div class="l">of '+(s.cal_target)+' kcal</div></div>'
      +bar('Calories',cal,s.cal_target,'')+bar('Protein',pro,s.protein_target,'g')+bar('Carbs',carb,s.carbs_target,'g')+bar('Fat',fat,s.fat_target,'g')
    +'</div></div>'
    +'<div class="card"><div class="card-h">'+svg(I.food,'ic')+'<h2>Food log</h2></div><div class="card-b">'
      +'<div class="quick" style="flex-wrap:wrap">'
        +'<input class="grow" id="fName" placeholder="Food item">'
        +'<select id="fMeal"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snack</option></select>'
        +'<input id="fCal" type="number" placeholder="kcal" style="width:80px">'
        +'<input id="fPro" type="number" placeholder="P" style="width:60px">'
        +'<input id="fCarb" type="number" placeholder="C" style="width:60px">'
        +'<input id="fFat" type="number" placeholder="F" style="width:60px">'
        +'<button class="btn primary" onclick="addFood()">'+svg(I.plus,'')+'</button>'
      +'</div>'
      +(mealBlocks||'<div class="empty">No food logged for this day.</div>')
    +'</div></div></div>';
}
async function addFood(){
  const n=el('fName').value.trim();if(!n)return;
  await sb.from('dc_food').insert({name:n,meal:el('fMeal').value,log_date:state.date,
    calories:parseInt(el('fCal').value)||0,protein:parseInt(el('fPro').value)||0,
    carbs:parseInt(el('fCarb').value)||0,fat:parseInt(el('fFat').value)||0});
  el('fName').value='';el('fCal').value='';el('fPro').value='';el('fCarb').value='';el('fFat').value='';
  navigate('food');
}
